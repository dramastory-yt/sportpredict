# Chaque matin (≈ 6 h 40 Paris) et à chaque push : collecte des données gratuites,
# tests du moteur, construction de dist/index.html et publication sur GitHub Pages.
name: Publier SportPredict
on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/engine.test.mjs
      - run: node build.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl xlrd
      - name: Collecte des données (une source en échec n'arrête pas la publication)
        run: python scripts/collect.py dist/data
      - name: Backtest chronologique sur les données réelles
        run: node scripts/backtest.mjs dist/data
      - name: Alerte du matin sur Telegram (facultative, seulement si les secrets existent)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BANKROLL: ${{ secrets.BANKROLL }}
        run: |
          if [ -z "$ODDS_API_KEY" ] || [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Alerte non configurée."; exit 0; fi
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node scripts/morning.mjs dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SportPredict AI</title>
<meta name="description" content="Moteur personnel d'analyse et de détection de value bets : football, tennis, NBA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : barre de navigation fixe + colonne centrale ; tableau de bord « salle de contrôle » nocturne,
   accent ambre (projecteurs de stade), chiffres en mono tabulaire. */
:root {
  color-scheme: dark;
  --bg: #0a1020; --surface: #111a2e; --surface2: #16213a; --line: #22304f;
  --fg: #e6ebf5; --muted: #8b97b0; --accent: #f2b33d; --accent-ink: #1a1203;
  --pos: #3fc59b; --neg: #f06a6a; --warn: #f08a3c; --info: #6aa8f7;
  --foot: #4fa3f7; --tennis: #c9d94e; --nba: #f07b3f;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 15px/1.55 var(--f-body); padding-bottom: env(safe-area-inset-bottom, 0px); }
a { color: var(--accent); }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; margin: 0 0 .5rem; letter-spacing: -.01em; }
h2 { font-size: 1.7rem; font-weight: 800; margin-top: .5rem; }
h3 { font-size: 1.2rem; font-weight: 700; }
h4 { font-size: .95rem; font-weight: 700; margin-top: .9rem; color: var(--fg); }
h5 { font: 600 .8rem var(--f-body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: .7rem 0 .2rem; }
small, .muted { color: var(--muted); }
.n, .kpi b, .kpis b, .odds { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.pos { color: var(--pos); } .neg { color: var(--neg); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.top .in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 1.2rem; padding-block: .6rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { font: 800 1.15rem var(--f-display); white-space: nowrap; display: flex; align-items: center; gap: .5rem; }
.brand i { width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(var(--accent) 0 62%, var(--line) 0); display: inline-block; }
.brand span { color: var(--accent); }
nav { display: flex; gap: .2rem; overflow-x: auto; scrollbar-width: none; min-width: 0; }
nav a { color: var(--muted); text-decoration: none; padding: .35rem .65rem; border-radius: 7px; white-space: nowrap; font-weight: 500; font-size: .9rem; }
nav a:hover { color: var(--fg); background: var(--surface); }
nav a.on { color: var(--accent-ink); background: var(--accent); }

main { max-width: 1180px; margin: 0 auto; padding-block: 1.4rem 3rem; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 1.1rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1.1rem 1.2rem; min-width: 0; }
.card.empty { text-align: center; color: var(--muted); padding: 2rem 1rem; }
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); }
.grid2 { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.row { display: flex; gap: .6rem; flex-wrap: wrap; align-items: center; }

.hero { display: grid; gap: 1rem; }
.date { font: 700 clamp(1.5rem, 4vw, 2.3rem) var(--f-display); text-transform: capitalize; letter-spacing: -.02em; }
.pills { display: flex; flex-wrap: wrap; gap: .4rem; }
.pill { font-size: .78rem; padding: .2rem .6rem; border-radius: 99px; border: 1px solid var(--line); display: inline-flex; align-items: center; gap: .35rem; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.p-ok::before { background: var(--pos); } .p-bad::before { background: var(--neg); } .p-run::before { background: var(--accent); animation: pulse 1s infinite alternate; }
.kpirow { display: grid; gap: .6rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: .7rem .85rem; display: grid; gap: .1rem; min-width: 0; }
.kpi small { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; }
.kpi b { font-size: 1.35rem; font-weight: 500; }
.kpi span { font-size: .78rem; color: var(--muted); }
.cta { display: flex; flex-direction: column; align-items: center; gap: .7rem; padding: 1.6rem 0 .4rem; }
.btn-main { font: 800 clamp(1rem, 2.6vw, 1.35rem) var(--f-display); letter-spacing: .02em; color: var(--accent-ink); background: var(--accent); border: 0; border-radius: 14px; padding: 1.15rem 2.4rem; cursor: pointer; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent), 0 14px 40px -12px color-mix(in srgb, var(--accent) 60%, transparent); transition: transform .15s; max-width: 100%; }
.btn-main:hover:not(:disabled) { transform: translateY(-1px); }
.btn-main:disabled { opacity: .5; cursor: progress; }
.btn-main.sm { font-size: 1rem; padding: .7rem 1.4rem; box-shadow: none; }
.btn-sec { font: 600 .85rem var(--f-body); letter-spacing: .03em; color: var(--fg); background: var(--surface2); border: 1px solid var(--line); border-radius: 9px; padding: .55rem 1rem; cursor: pointer; }
.btn-sec:hover:not(:disabled) { border-color: var(--accent); }
.btn-sec:disabled { opacity: .45; }
.file input { display: none; }
.notice { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: var(--r); padding: .7rem 1rem; }

.progress { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 1rem 1.1rem; display: grid; gap: .6rem; }
.pb { height: 6px; background: var(--line); border-radius: 9px; overflow: hidden; }
.pb i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: .15rem; }
.step { display: grid; grid-template-columns: 14px 1fr auto; gap: .2rem .6rem; align-items: center; padding: .3rem 0; border-bottom: 1px dashed var(--line); }
.step .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.step .sst { font-size: .78rem; color: var(--muted); }
.step .snote { grid-column: 2 / -1; font-size: .8rem; color: var(--muted); }
.s-termine .dot { background: var(--pos); } .s-en-cours .dot { background: var(--accent); animation: pulse .8s infinite alternate; }
.s-erreur .dot { background: var(--neg); } .s-erreur .sst { color: var(--neg); } .s-avertissement .dot { background: var(--warn); }
@keyframes pulse { to { opacity: .3; } }

.pick header, .card header { display: flex; justify-content: space-between; gap: .6rem; flex-wrap: wrap; align-items: baseline; margin-bottom: .3rem; }
.when { font-family: var(--f-mono); font-size: .85rem; color: var(--muted); }
.sport { font: 600 .72rem var(--f-body); text-transform: uppercase; letter-spacing: .07em; padding: .1rem .45rem; border-radius: 5px; border: 1px solid; }
.s-football { color: var(--foot); } .s-tennis { color: var(--tennis); } .s-nba, .s-basket { color: var(--nba); }
.pick h3 { font-size: 1.3rem; }
.pick.big { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, var(--surface)), var(--surface) 240px); }
.pick.big h3 { font-size: clamp(1.4rem, 3.5vw, 2rem); }
.sel { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin-bottom: .8rem; }
.sel b { font: 700 1.15rem var(--f-display); color: var(--accent); }
.mk { font-size: .72rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); border: 1px solid var(--line); padding: .05rem .4rem; border-radius: 4px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: .5rem; }
.kpis > div { background: var(--surface2); border-radius: 8px; padding: .5rem .65rem; display: grid; min-width: 0; }
.kpis small { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.kpis b { font-size: 1.15rem; font-weight: 500; }
.kpis span { font-size: .72rem; color: var(--muted); overflow-wrap: anywhere; }
.big .kpis b.odds { font-size: 1.6rem; color: var(--accent); }
.why p { max-width: 75ch; }
.risks ul, .llm ul, .info, .news { margin: .2rem 0; padding-left: 1.1rem; }
details { margin-top: .6rem; border-top: 1px solid var(--line); padding-top: .5rem; }
summary { cursor: pointer; color: var(--muted); font-size: .88rem; }
summary:hover { color: var(--fg); }
.parts { display: grid; gap: .35rem; margin-top: .5rem; }
.sp { display: grid; grid-template-columns: minmax(120px, 1.2fr) 1fr auto; gap: .1rem .6rem; align-items: center; font-size: .85rem; }
.sp small { grid-column: 1 / -1; font-size: .75rem; }
.bar { height: 6px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: .3rem; margin: .5rem 0; }
.chip { font-size: .75rem; background: var(--surface2); border: 1px solid var(--line); border-radius: 99px; padding: .1rem .55rem; font-family: var(--f-mono); }
.tag { font-size: .72rem; padding: .05rem .45rem; border-radius: 5px; font-weight: 600; white-space: nowrap; }
.t-ok { background: color-mix(in srgb, var(--pos) 18%, transparent); color: var(--pos); }
.t-bad { background: color-mix(in srgb, var(--neg) 18%, transparent); color: var(--neg); }
.t-warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.t-na { background: var(--surface2); color: var(--muted); }
.llm { margin-top: .8rem; background: var(--surface2); border-radius: 8px; padding: .7rem .9rem; }
.advice { margin: .8rem 0 .2rem; padding: .75rem .9rem; border-radius: 8px; background: color-mix(in srgb, var(--accent) 10%, var(--surface2)); border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); max-width: 80ch; }
.onb ol { margin: .4rem 0; padding-left: 1.2rem; } .onb input { flex: 1; min-width: 200px; }
.headline { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; margin: .2rem 0 .5rem; }
.pbar3 { display: flex; height: 8px; border-radius: 6px; overflow: hidden; background: var(--line); }
.pbar3 i:nth-child(1) { background: var(--accent); } .pbar3 i:nth-child(2) { background: var(--muted); } .pbar3 i:nth-child(3) { background: var(--info); }
.pl3 { display: flex; justify-content: space-between; font: 500 .8rem var(--f-mono); color: var(--muted); margin: .25rem 0 .5rem; }
.formrow { display: grid; gap: .3rem; margin: .4rem 0; } .formrow > div { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; } .formrow small:first-child { min-width: 9ch; }
.form { display: inline-flex; gap: 2px; } .form i { font: 600 .7rem var(--f-mono); width: 1.3em; text-align: center; border-radius: 3px; padding: .05rem 0; font-style: normal; }
.r-V { background: color-mix(in srgb, var(--pos) 25%, transparent); color: var(--pos); } .r-N { background: var(--surface2); color: var(--muted); } .r-D { background: color-mix(in srgb, var(--neg) 22%, transparent); color: var(--neg); }
.eyebrow { font: 800 .78rem var(--f-display); letter-spacing: .14em; color: var(--accent); margin-bottom: .4rem; }
.daily h3 { font-size: clamp(1.5rem, 4vw, 2.2rem); }
.betbtn { margin-top: .6rem; } .linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font: inherit; font-size: .8rem; }
.chart .barp { fill: var(--pos); } .chart .barn { fill: var(--neg); }
.nobet { border-color: color-mix(in srgb, var(--muted) 40%, var(--line)); text-align: center; padding: 2.2rem 1rem; }
.nobet h3 { font-size: 1.5rem; letter-spacing: .02em; }

.tw { overflow-x: auto; }
.t { width: 100%; border-collapse: collapse; font-size: .85rem; }
.t td, .t th { padding: .38rem .5rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.t th { font-weight: 600; color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
.t .n { text-align: right; white-space: nowrap; }
.hist td { white-space: nowrap; } .hist td:nth-child(2) { white-space: normal; min-width: 180px; }
.manual button { font: 600 .75rem var(--f-mono); background: var(--surface2); color: var(--fg); border: 1px solid var(--line); border-radius: 5px; padding: .1rem .4rem; cursor: pointer; }

.filters { display: flex; flex-wrap: wrap; gap: .6rem; }
.filters label, .cfg label { display: grid; gap: .2rem; font-size: .8rem; color: var(--muted); }
input, select { font: 500 .9rem var(--f-body); background: var(--surface2); color: var(--fg); border: 1px solid var(--line); border-radius: 7px; padding: .45rem .55rem; min-width: 0; }
.cfg { display: grid; gap: 1rem; }
.cfg input[type=password], .cfg input[type=text] { width: 100%; }
.g3 { display: grid; gap: .7rem; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.chks { display: flex; flex-wrap: wrap; gap: .4rem 1rem; margin-bottom: .6rem; }
label.chk { display: flex; align-items: center; gap: .4rem; color: var(--fg); font-size: .9rem; }
.cal { display: grid; gap: .35rem; }
.ev { display: grid; grid-template-columns: 150px 80px 1fr auto auto; gap: .8rem; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: .6rem .8rem; color: var(--fg); font: inherit; cursor: pointer; }
.ev:hover { border-color: var(--accent); }
.ev .m { display: grid; min-width: 0; } .ev .m small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev .sport { justify-self: start; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: transparent; color: var(--muted); border: 0; padding: .45rem .9rem; font: 600 .85rem var(--f-body); cursor: pointer; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.chart { width: 100%; height: auto; }
.chart .axis { stroke: var(--line); stroke-width: 1; } .chart .dash { stroke-dasharray: 4 4; stroke: var(--muted); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; } .chart .area { fill: color-mix(in srgb, var(--accent) 12%, transparent); }
.chart .endpt { fill: var(--accent); } .chart .dotc { fill: color-mix(in srgb, var(--info) 60%, transparent); stroke: var(--info); }
.chart .lbl { fill: var(--muted); font: 11px var(--f-mono); } .chart .lbl.b { fill: var(--fg); }

.dlg { position: fixed; inset: 0; background: rgb(3 6 14 / .7); z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.dlgc { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; max-width: 900px; width: 100%; max-height: 88vh; overflow: auto; padding: 1.1rem 1.2rem; }
.x { background: transparent; color: var(--muted); border: 0; font-size: 1.6rem; cursor: pointer; line-height: 1; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--surface2); border: 1px solid var(--line); border-left: 3px solid var(--pos); padding: .6rem 1rem; border-radius: 8px; z-index: 60; max-width: calc(100% - 32px); }
.toast.bad { border-left-color: var(--neg); }
.disc { font-size: .78rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 1rem; max-width: 90ch; }
@media (max-width: 640px) {
  .top .in { flex-direction: column; align-items: stretch; gap: .4rem; }
  .ev { grid-template-columns: 1fr auto; }
  .ev .when, .ev .n:first-of-type { grid-column: 1 / -1; }
  .btn-main { padding: 1rem 1.2rem; width: 100%; }
}
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<script>
/* SportPredict AI — moteur statistique (pur JS, sans dépendance).
 * Ce fichier est utilisé tel quel dans le navigateur (thread principal + Web Worker)
 * et dans Node pour les tests. Toute la logique est dans SPEngineFactory pour
 * pouvoir être sérialisée vers le worker via Function.prototype.toString().
 */
function SPEngineFactory() {
  'use strict';
  const SP = { version: 'engine-1.0.0' };

  // ---------------------------------------------------------------- RNG
  // mulberry32 : rapide, 32 bits, reproductible avec la graine enregistrée dans le snapshot.
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  SP.rng = rng;
  function normalPair(r) {
    let u = r(); while (u < 1e-12) u = r();
    const v = r();
    const m = Math.sqrt(-2 * Math.log(u));
    return [m * Math.cos(2 * Math.PI * v), m * Math.sin(2 * Math.PI * v)];
  }
  SP.normalPair = normalPair;
  function poissonDraw(r, lam) {
    // inversion (λ < ~15 en football) ; approximation normale au-delà
    if (lam > 30) return Math.max(0, Math.round(lam + Math.sqrt(lam) * normalPair(r)[0]));
    const u = r();
    let p = Math.exp(-lam), s = p, k = 0;
    while (u > s && k < 60) { k++; p *= lam / k; s += p; }
    return k;
  }
  SP.poissonDraw = poissonDraw;

  // ---------------------------------------------------------------- cotes
  SP.implied = (o) => 1 / o;
  SP.ev = (p, o) => p * o - 1;
  SP.overround = (odds) => odds.reduce((s, o) => s + 1 / o, 0) - 1;
  // Méthode « power » : trouve k tel que Σ (1/o_i)^k = 1. Corrige mieux le biais favori/outsider
  // que la normalisation proportionnelle. Retombe sur la normalisation si non convergé.
  SP.devig = function (odds) {
    const q = odds.map((o) => 1 / o);
    const sum = q.reduce((a, b) => a + b, 0);
    if (!(sum > 0)) return null;
    if (Math.abs(sum - 1) < 1e-9) return q;
    let lo = 0.5, hi = 3;
    const f = (k) => q.reduce((s, x) => s + Math.pow(x, k), 0) - 1;
    if (f(lo) * f(hi) > 0) return q.map((x) => x / sum);
    for (let i = 0; i < 80; i++) {
      const mid = (lo + hi) / 2;
      if (f(mid) > 0) lo = mid; else hi = mid;
    }
    const k = (lo + hi) / 2;
    const p = q.map((x) => Math.pow(x, k));
    const s2 = p.reduce((a, b) => a + b, 0);
    return p.map((x) => x / s2);
  };
  SP.median = function (a) {
    if (!a.length) return NaN;
    const s = [...a].sort((x, y) => x - y);
    const m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  };
  SP.sd = function (a) {
    if (a.length < 2) return 0;
    const m = a.reduce((x, y) => x + y, 0) / a.length;
    return Math.sqrt(a.reduce((s, x) => s + (x - m) * (x - m), 0) / (a.length - 1));
  };

  // Règlement générique d'une ligne (handicap asiatique / total) : x = marge ajustée.
  // Renvoie le rendement par unité misée (cote incluse) : gain=o, remboursé=1, perdu=0.
  // Les lignes en quart (.25/.75) sont scindées en deux demi-mises.
  function half(x) { return x > 1e-9 ? [1, 0] : (x < -1e-9 ? [0, 0] : [0, 1]); }
  // Renvoie {win, push} : parts de la mise gagnées / remboursées (0, 0.5 ou 1).
  SP.settleShares = function (margin, line) {
    if (line == null) return margin > 0 ? { win: 1, push: 0 } : { win: 0, push: 0 };
    const frac = Math.abs((line * 4) % 2);
    if (Math.abs(frac - 1) < 1e-9) {
      const a = half(margin + line - 0.25), b = half(margin + line + 0.25);
      return { win: (a[0] + b[0]) / 2, push: (a[1] + b[1]) / 2 };
    }
    const a = half(margin + line);
    return { win: a[0], push: a[1] };
  };
  SP.settleLine = function (margin, line, o) {
    const s = SP.settleShares(margin, line);
    return s.win * o + s.push;
  };

  // ---------------------------------------------------------------- Poisson / Dixon-Coles
  function pois(k, lam) {
    let p = Math.exp(-lam);
    for (let i = 1; i <= k; i++) p *= lam / i;
    return p;
  }
  SP.pois = pois;
  function tau(x, y, lh, la, rho) {
    if (x === 0 && y === 0) return 1 - lh * la * rho;
    if (x === 0 && y === 1) return 1 + lh * rho;
    if (x === 1 && y === 0) return 1 + la * rho;
    if (x === 1 && y === 1) return 1 - rho;
    return 1;
  }
  SP.scoreMatrix = function (lh, la, rho = 0, max = 10) {
    const m = [];
    let tot = 0;
    for (let i = 0; i <= max; i++) {
      m.push([]);
      for (let j = 0; j <= max; j++) {
        const v = Math.max(0, pois(i, lh) * pois(j, la) * tau(i, j, lh, la, rho));
        m[i].push(v); tot += v;
      }
    }
    for (let i = 0; i <= max; i++) for (let j = 0; j <= max; j++) m[i][j] /= tot;
    return m;
  };
  SP.matrix1x2 = function (m) {
    let h = 0, d = 0, a = 0;
    for (let i = 0; i < m.length; i++) for (let j = 0; j < m.length; j++) {
      if (i > j) h += m[i][j]; else if (i === j) d += m[i][j]; else a += m[i][j];
    }
    return [h, d, a];
  };
  SP.matrixOver = function (m, line) {
    let o = 0;
    for (let i = 0; i < m.length; i++) for (let j = 0; j < m.length; j++) if (i + j > line) o += m[i][j];
    return o;
  };

  // Lambdas implicites du marché : (pH,pD,pA[,pOver@line]) -> (λh, λa) par moindres carrés.
  SP.impliedLambdas = function (p1x2, over) {
    let best = null;
    const loss = (lh, la) => {
      const m = SP.scoreMatrix(lh, la, -0.05, 10);
      const r = SP.matrix1x2(m);
      let e = (r[0] - p1x2[0]) ** 2 + (r[1] - p1x2[1]) ** 2 + (r[2] - p1x2[2]) ** 2;
      if (over) e += (SP.matrixOver(m, over.line) - over.p) ** 2;
      return e;
    };
    for (let lh = 0.2; lh <= 4.01; lh += 0.1) for (let la = 0.2; la <= 4.01; la += 0.1) {
      const e = loss(lh, la);
      if (!best || e < best.e) best = { lh, la, e };
    }
    // raffinement local
    let step = 0.05;
    for (let it = 0; it < 40 && step > 0.002; it++) {
      let improved = false;
      for (const [dh, da] of [[step, 0], [-step, 0], [0, step], [0, -step]]) {
        const lh = best.lh + dh, la = best.la + da;
        if (lh <= 0.05 || la <= 0.05) continue;
        const e = loss(lh, la);
        if (e < best.e) { best = { lh, la, e }; improved = true; }
      }
      if (!improved) step /= 2;
    }
    return best;
  };

  // Ajustement Dixon-Coles pondéré dans le temps (Dixon & Coles 1997, ξ par jour).
  // matches : [{t (ms), h, a, hg, ag}] ; renvoie attaques/défenses, avantage domicile, rho.
  SP.fitDixonColes = function (matches, opts = {}) {
    const xi = opts.xi ?? 0.0019; // demi-vie ≈ 1 an
    const ridge = opts.ridge ?? 2.0; // rétrécissement vers la moyenne (petits échantillons)
    const now = opts.asOf ?? Math.max(...matches.map((m) => m.t));
    const teams = [...new Set(matches.flatMap((m) => [m.h, m.a]))];
    const idx = new Map(teams.map((t, i) => [t, i]));
    const n = teams.length;
    const att = new Float64Array(n), def = new Float64Array(n);
    let home = 0.25, mu = Math.log(1.3);
    const data = matches.filter((m) => m.t <= now).map((m) => ({
      h: idx.get(m.h), a: idx.get(m.a), hg: m.hg, ag: m.ag,
      w: Math.exp(-xi * (now - m.t) / 86400000),
    }));
    if (data.length < 20) return null;
    const W = data.reduce((s, d) => s + d.w, 0);
    // Descente par blocs (attaques, puis défenses, puis domicile/moyenne), pas de Newton diagonal.
    // Mettre à jour tous les paramètres en même temps fait osciller l'ajustement, car ils absorbent
    // le même résidu : c'est ce que le backtest sur données réelles a montré.
    const pass = (block) => {
      const g = new Float64Array(n), h = new Float64Array(n);
      let gH = 0, hH = 0, gM = 0, hM = 0;
      for (const d of data) {
        const lh = Math.exp(mu + home + att[d.h] + def[d.a]);
        const la = Math.exp(mu + att[d.a] + def[d.h]);
        const rh = d.w * (d.hg - lh), ra = d.w * (d.ag - la);
        if (block === 0) { g[d.h] += rh; h[d.h] += d.w * lh; g[d.a] += ra; h[d.a] += d.w * la; }
        else if (block === 1) { g[d.a] += rh; h[d.a] += d.w * lh; g[d.h] += ra; h[d.h] += d.w * la; }
        else { gH += rh; hH += d.w * lh; gM += rh + ra; hM += d.w * (lh + la); }
      }
      if (block === 0) for (let i = 0; i < n; i++) att[i] += (g[i] - ridge * att[i]) / (h[i] + ridge);
      else if (block === 1) for (let i = 0; i < n; i++) def[i] += (g[i] - ridge * def[i]) / (h[i] + ridge);
      else { mu += gM / (hM + 1e-9); }
      if (block === 3) home += gH / (hH + 1e-9);
    };
    for (let it = 0; it < 40; it++) {
      pass(0); pass(1); pass(2); pass(3);
      const ma = att.reduce((s, x) => s + x, 0) / n, md = def.reduce((s, x) => s + x, 0) / n;
      for (let i = 0; i < n; i++) { att[i] -= ma; def[i] -= md; }
      mu += ma + md;
    }
    // rho par recherche 1D (sans objet pour un ajustement sur xG non entiers)
    let bestRho = 0, bestLL = -Infinity;
    for (let rho = -0.2; rho <= 0.1001 && !opts.skipRho; rho += 0.01) {
      let ll = 0;
      for (const d of data) {
        if (d.hg > 1 || d.ag > 1) continue;
        const lh = Math.exp(mu + home + att[d.h] + def[d.a]);
        const la = Math.exp(mu + att[d.a] + def[d.h]);
        const t = tau(d.hg, d.ag, lh, la, rho);
        if (t <= 0) { ll = -Infinity; break; }
        ll += d.w * Math.log(t);
      }
      if (ll > bestLL) { bestLL = ll; bestRho = rho; }
    }
    const games = new Map();
    for (const d of data) { games.set(d.h, (games.get(d.h) || 0) + 1); games.set(d.a, (games.get(d.a) || 0) + 1); }
    const model = {
      teams, mu, home, rho: Math.round(bestRho * 100) / 100, nMatches: data.length, effN: W,
      att: Object.fromEntries(teams.map((t, i) => [t, att[i]])),
      def: Object.fromEntries(teams.map((t, i) => [t, def[i]])),
      games: Object.fromEntries(teams.map((t, i) => [t, games.get(i) || 0])),
    };
    return model;
  };
  SP.dcLambdas = function (model, h, a) {
    if (!model || !(h in model.att) || !(a in model.att)) return null;
    return {
      lh: Math.exp(model.mu + model.home + model.att[h] + model.def[a]),
      la: Math.exp(model.mu + model.att[a] + model.def[h]),
    };
  };

  // ---------------------------------------------------------------- Elo générique
  SP.eloRun = function (matches, opts = {}) {
    const K = opts.K ?? 20, H = opts.home ?? 60, init = 1500;
    const R = new Map();
    const get = (t) => (R.has(t) ? R.get(t) : init);
    const pre = [];
    for (const m of matches) {
      const rh = get(m.h), ra = get(m.a);
      const dr = rh + H - ra;
      pre.push(dr);
      const e = 1 / (1 + Math.pow(10, -dr / 400));
      const s = m.hg > m.ag ? 1 : m.hg === m.ag ? 0.5 : 0;
      const gd = Math.abs(m.hg - m.ag);
      const mult = opts.marginMult ? opts.marginMult(gd, dr) : (gd <= 1 ? 1 : gd === 2 ? 1.5 : (11 + gd) / 8);
      R.set(m.h, rh + K * mult * (s - e));
      R.set(m.a, ra - K * mult * (s - e));
    }
    return { ratings: R, preDiff: pre, get, H };
  };

  // Régression logistique ordinale (H > D > A) sur la différence Elo, ajustée par gradient.
  // P(A) = σ(c1 − b·x), P(A ou D) = σ(c2 − b·x)   (x = diff/100)
  SP.fitOrdinal = function (xs, ys) {
    let b = 0.3, c1 = -0.4, c2 = 0.6;
    const sig = (z) => 1 / (1 + Math.exp(-z));
    const lr = 0.05;
    for (let it = 0; it < 400; it++) {
      let gb = 0, g1 = 0, g2 = 0;
      for (let i = 0; i < xs.length; i++) {
        const x = xs[i], y = ys[i];
        const s1 = sig(c1 - b * x), s2 = sig(c2 - b * x);
        // log-vraisemblance et gradients
        if (y === 2) { // extérieur
          g1 += (1 - s1); gb += -(1 - s1) * x;
        } else if (y === 1) { // nul
          const pd = Math.max(1e-9, s2 - s1);
          const d2 = s2 * (1 - s2), d1 = s1 * (1 - s1);
          g2 += d2 / pd; g1 += -d1 / pd; gb += (-d2 * x + d1 * x) / pd;
        } else { // domicile
          g2 += -s2; gb += s2 * x;
        }
      }
      const n = xs.length || 1;
      b += lr * gb / n; c1 += lr * g1 / n * 4; c2 += lr * g2 / n * 4;
      if (c2 < c1 + 0.05) c2 = c1 + 0.05;
    }
    return { b, c1, c2 };
  };
  SP.ordinalProbs = function (p, diff) {
    const sig = (z) => 1 / (1 + Math.exp(-z));
    const x = diff / 100;
    const pa = sig(p.c1 - p.b * x), pad = sig(p.c2 - p.b * x);
    return [1 - pad, Math.max(0.01, pad - pa), pa];
  };

  SP.logLoss3 = (p, y) => -Math.log(Math.max(1e-9, p[y]));
  SP.brier3 = (p, y) => p.reduce((s, v, i) => s + (v - (i === y ? 1 : 0)) ** 2, 0);

  // Pondération d'ensemble : minimise la log-loss du mélange sur les prédictions
  // hors-échantillon (chronologiques). Grille sur le simplexe (pas 0.05).
  SP.stackWeights = function (predsByModel, ys) {
    const names = Object.keys(predsByModel);
    if (names.length === 1) return { [names[0]]: 1 };
    let best = null;
    const step = 0.05;
    const rec = (k, left, w) => {
      if (k === names.length - 1) {
        const ww = [...w, left];
        let ll = 0;
        for (let i = 0; i < ys.length; i++) {
          const mix = [0, 0, 0].map((_, c) => names.reduce((s, nm, j) => s + ww[j] * predsByModel[nm][i][c], 0));
          ll += SP.logLoss3(mix, ys[i]);
        }
        if (!best || ll < best.ll) best = { ll, w: ww };
        return;
      }
      for (let x = 0; x <= left + 1e-9; x += step) rec(k + 1, Math.round((left - x) * 100) / 100, [...w, x]);
    };
    rec(0, 1, []);
    return Object.fromEntries(names.map((n, i) => [n, best.w[i]]));
  };

  // Validation chronologique football : chaque match est prédit uniquement avec les
  // matchs antérieurs (Elo séquentiel ; Dixon-Coles réajusté tous les `refitDays` jours).
  SP.footballBacktest = function (matches, opts = {}) {
    const ms = [...matches].sort((a, b) => a.t - b.t);
    const warm = opts.warmup ?? Math.max(60, Math.floor(ms.length * 0.35));
    const refit = (opts.refitDays ?? 14) * 86400000;
    const elo = SP.eloRun(ms, { K: 20, home: 60 });
    const ys = ms.map((m) => (m.hg > m.ag ? 0 : m.hg === m.ag ? 1 : 2));
    // ordinal Elo ajusté sur la phase de chauffe seulement (pas de fuite)
    const ord = SP.fitOrdinal(elo.preDiff.slice(0, warm).map((d) => d / 100), ys.slice(0, warm));
    const hasXG = ms.filter((m) => m.hxg != null).length >= 0.7 * ms.length;
    const preds = hasXG ? { elo: [], dc: [], xg: [] } : { elo: [], dc: [] }, yy = [], mkt = [];
    let dc = null, dcx = null, lastFit = -Infinity;
    for (let i = warm; i < ms.length; i++) {
      const m = ms[i];
      if (m.t - lastFit > refit || !dc) {
        dc = SP.fitDixonColes(ms.slice(0, i), { asOf: m.t });
        if (hasXG) dcx = SP.fitDixonColes(ms.slice(0, i).filter((x) => x.hxg != null).map((x) => ({ ...x, hg: x.hxg, ag: x.axg })), { asOf: m.t, skipRho: true });
        lastFit = m.t;
      }
      const lam = SP.dcLambdas(dc, m.h, m.a);
      if (!lam) continue;
      let px = null;
      if (hasXG) { const lx = SP.dcLambdas(dcx, m.h, m.a); if (!lx) continue; px = SP.matrix1x2(SP.scoreMatrix(lx.lh, lx.la, dc.rho, 10)); }
      preds.dc.push(SP.matrix1x2(SP.scoreMatrix(lam.lh, lam.la, dc.rho, 10)));
      preds.elo.push(SP.ordinalProbs(ord, elo.preDiff[i]));
      if (hasXG) preds.xg.push(px);
      mkt.push(m.pin ? SP.devig(m.pin) : null);
      yy.push(ys[i]);
    }
    if (yy.length < 30) return null;
    // référence naïve : fréquences de la phase de chauffe
    const fq = [0, 0, 0]; ys.slice(0, warm).forEach((y) => fq[y]++);
    const tot = fq[0] + fq[1] + fq[2];
    const naive = fq.map((x) => x / tot);
    const res = { n: yy.length, models: {} };
    for (const k of Object.keys(preds)) {
      res.models[k] = {
        logLoss: preds[k].reduce((s, p, i) => s + SP.logLoss3(p, yy[i]), 0) / yy.length,
        brier: preds[k].reduce((s, p, i) => s + SP.brier3(p, yy[i]), 0) / yy.length,
      };
    }
    res.naive = { logLoss: yy.reduce((s, y) => s + SP.logLoss3(naive, y), 0) / yy.length };
    res.weights = SP.stackWeights(preds, yy);
    const mix = yy.map((_, i) => [0, 1, 2].map((c) => Object.keys(preds).reduce((s, k) => s + res.weights[k] * preds[k][i][c], 0)));
    res.ensemble = {
      logLoss: mix.reduce((s, p, i) => s + SP.logLoss3(p, yy[i]), 0) / yy.length,
      brier: mix.reduce((s, p, i) => s + SP.brier3(p, yy[i]), 0) / yy.length,
    };
    res.calibration = SP.calibrationBins(mix.map((p) => p[0]), yy.map((y) => (y === 0 ? 1 : 0)));
    // comparaison au marché (cotes Pinnacle de clôture) et poids optimal marché/stats
    const idx = mkt.map((p, i) => (p ? i : -1)).filter((i) => i >= 0);
    if (idx.length >= 80) {
      res.market = { n: idx.length, logLoss: idx.reduce((s, i) => s + SP.logLoss3(mkt[i], yy[i]), 0) / idx.length };
      let best = null;
      for (let w = 0; w <= 1.0001; w += 0.05) {
        const ll = idx.reduce((s, i) => s + SP.logLoss3([0, 1, 2].map((c) => w * mkt[i][c] + (1 - w) * mix[i][c]), yy[i]), 0) / idx.length;
        if (!best || ll < best.ll) best = { ll, w: Math.round(w * 100) / 100 };
      }
      res.wMarket = best.w; res.blend = { logLoss: best.ll };
    }
    res.hasXG = hasXG;
    // ordinal final ajusté sur tout l'historique pour la prédiction du jour
    res.ordinal = SP.fitOrdinal(elo.preDiff.map((d) => d / 100), ys);
    res.elo = elo;
    return res;
  };


  // xG : vrai xG football-data quand présent, sinon estimation par les tirs (conversion estimée
  // sur la phase de chauffe seulement, donc sans fuite dans le backtest).
  SP.attachXG = function (ms) {
    const warm = ms.slice(0, Math.max(60, Math.floor(ms.length * 0.35))).flatMap((m) => [[m.hst, m.hs, m.hg], [m.ast, m.as, m.ag]]).filter((x) => x[0] != null && x[1] != null);
    let a = null, b = 0, nReal = 0, nProxy = 0;
    if (warm.length >= 100) {
      let s11 = 0, s12 = 0, s22 = 0, y1 = 0, y2 = 0;
      for (const [on, tot, g] of warm) { const off = Math.max(0, tot - on); s11 += on * on; s12 += on * off; s22 += off * off; y1 += on * g; y2 += off * g; }
      const det = s11 * s22 - s12 * s12;
      a = (y1 * s22 - y2 * s12) / det; b = (y2 * s11 - y1 * s12) / det;
      if (!(a > 0) || !(b >= 0)) { a = y1 / s11; b = 0; }
    }
    for (const m of ms) {
      if (m.rxh != null && m.rxa != null) { m.hxg = m.rxh; m.axg = m.rxa; nReal++; }
      else if (a != null && m.hst != null && m.hs != null && m.ast != null && m.as != null) { m.hxg = a * m.hst + b * Math.max(0, m.hs - m.hst); m.axg = a * m.ast + b * Math.max(0, m.as - m.ast); nProxy++; }
    }
    return { nReal, nProxy, a, b, label: [nReal ? `xG réel football-data (${nReal})` : '', nProxy ? `xG estimé par les tirs (${nProxy}, ${a.toFixed(3)} but/tir cadré)` : ''].filter(Boolean).join(' + ') };
  };
  SP.fdRow = (r) => ({ t: r[0], h: r[1], a: r[2], hg: r[3], ag: r[4], hs: r[5], as: r[6], hst: r[7], ast: r[8], pin: r[13] && r[14] && r[15] ? [r[13], r[14], r[15]] : null, rxh: r[18] ?? null, rxa: r[19] ?? null, refSrc: r[20] || null, cornersH: r[9], cornersA: r[10], cardsH: r[11], cardsA: r[12] });

  // Comptages surdispersés (corners, cartons) : loi binomiale négative de moyenne μ et variance φ·μ.
  SP.nbPmf = function (k, mu, phi) {
    if (phi <= 1.0001) return pois(k, mu);
    const r = mu / (phi - 1), p = r / (r + mu);
    let lg = 0; for (let i = 0; i < k; i++) lg += Math.log(r + i) - Math.log(i + 1);
    return Math.exp(lg + r * Math.log(p) + k * Math.log(1 - p));
  };
  SP.nbOver = function (mu, phi, line) {
    let cdf = 0; for (let k = 0; k <= Math.floor(line); k++) cdf += SP.nbPmf(k, mu, phi);
    return Math.max(0, 1 - cdf);
  };
  // Modèle de comptage par équipe (attaque/défense, avantage domicile) + dispersion estimée sur les résidus.
  SP.fitCounts = function (ms, key) {
    const data = ms.filter((m) => m[key + 'H'] != null && m[key + 'A'] != null).map((m) => ({ t: m.t, h: m.h, a: m.a, hg: m[key + 'H'], ag: m[key + 'A'] }));
    if (data.length < 100) return null;
    const fit = SP.fitDixonColes(data, { skipRho: true, xi: 0.0025, ridge: 4 });
    if (!fit) return null;
    let num = 0, den = 0;
    for (const d of data) { const l = SP.dcLambdas(fit, d.h, d.a); if (!l) continue; const mu = l.lh + l.la; num += (d.hg + d.ag - mu) ** 2; den += mu; }
    fit.phi = Math.max(1, num / den);
    fit.n = data.length;
    return fit;
  };
  // Recalibrage de Platt : p' = σ(a + b·logit p), ajusté sur les résultats réels.
  SP.fitPlatt = function (ps, ys) {
    let a = 0, b = 1;
    const lg = (p) => Math.log(Math.max(1e-6, p) / Math.max(1e-6, 1 - p));
    for (let it = 0; it < 500; it++) {
      let ga = 0, gb = 0;
      for (let i = 0; i < ps.length; i++) { const x = lg(ps[i]); const q = 1 / (1 + Math.exp(-(a + b * x))); ga += ys[i] - q; gb += (ys[i] - q) * x; }
      a += 0.5 * ga / ps.length; b += 0.5 * gb / ps.length;
    }
    return { a, b };
  };
  SP.applyPlatt = (c, p) => { const x = Math.log(Math.max(1e-6, p) / Math.max(1e-6, 1 - p)); return 1 / (1 + Math.exp(-(c.a + c.b * x))); };

  SP.calibrationBins = function (ps, ys, nb = 10) {
    const bins = Array.from({ length: nb }, () => ({ n: 0, p: 0, y: 0 }));
    ps.forEach((p, i) => {
      const b = Math.min(nb - 1, Math.floor(p * nb));
      bins[b].n++; bins[b].p += p; bins[b].y += ys[i];
    });
    return bins.filter((b) => b.n).map((b) => ({ n: b.n, pred: b.p / b.n, obs: b.y / b.n }));
  };

  // ---------------------------------------------------------------- NBA
  // Régression ridge pondérée : marge = HCA + r_h − r_a + β_rest·(repos) ; points = μ + off + def adverse.
  SP.fitNBA = function (games, opts = {}) {
    const xi = opts.xi ?? 0.006; // demi-vie ≈ 115 jours
    const lambda = opts.ridge ?? 8;
    const asOf = opts.asOf ?? Math.max(...games.map((g) => g.t));

  // ---------------------------------------------------------------- Tennis

  SP.tiebreakProb = function (pa, pb) {

  SP.selMargin = function (sel, x, y, wA) {

    if (sel.type === 'ahHome' || sel.type === 'ahAway' || sel.type === 'spread') return { ...sel, line: sel.point };
    return { ...sel, line: null };
  };

  // ---------------------------------------------------------------- Score de qualité
  // Score explicable sur 100 (≠ probabilité de réussite). Chaque composante est renvoyée.
  SP.qualityScore = function (c) {
    const parts = [];
    const add = (name, pts, max, why) => parts.push({ name, pts: Math.max(0, Math.min(max, pts)), max, why });
    // 1. value rapportée à l'incertitude (z-score de l'edge)
    const z = c.edge / Math.max(0.005, c.uncert);
    add('Value / incertitude', 25 * Math.min(1, Math.max(0, z) / 3), 25, `edge ${(c.edge * 100).toFixed(1)} pts, z=${z.toFixed(2)}`);
    // 2. accord entre modèles
    add('Accord des modèles', c.modelGap == null ? 6 : 15 * Math.max(0, 1 - c.modelGap / 0.08), 15,
      c.modelGap == null ? 'un seul modèle disponible' : `écart max ${(c.modelGap * 100).toFixed(1)} pts`);
    // 3. qualité des données
    add('Qualité des données', c.dataQuality * 15, 15, c.dataNote || '');
    // 4. calibration
    add('Calibration', c.calib == null ? 4 : 10 * Math.max(0, Math.min(1, c.calib)), 10,
      c.calib == null ? 'pas de backtest disponible' : `gain log-loss vs naïf ${(c.calib * 100).toFixed(0)}%`);
    // 5. stabilité des simulations
    add('Stabilité simulations', 10 * Math.max(0, 1 - c.mcSpread / 0.15), 10, `écart scénarios ${(c.mcSpread * 100).toFixed(1)} pts`);
    // 6. disponibilité/fraîcheur des cotes
    const fresh = Math.max(0, 1 - c.oddsAgeMin / 60);
    add('Disponibilité des cotes', 10 * (0.6 * fresh + 0.4 * Math.min(1, c.booksAtPrice / 3)), 10,
      `${Math.round(c.oddsAgeMin)} min, ${c.booksAtPrice} bookmaker(s) ≥ cote`);
    // 7. risques contextuels / informations
    add('Risques contextuels', 10 - c.riskPenalty, 10, c.riskNote || 'aucun signal');
    // 8. zone de cote privilégiée
    add('Zone de cote', c.odds >= 1.4 && c.odds <= 2.2 ? 5 : c.odds < 1.4 ? 2 : 3, 5, `cote ${c.odds.toFixed(2)}`);
    const total = parts.reduce((s, p) => s + p.pts, 0);
    return { total: Math.round(total), parts };
  };

  return SP;
}

/* SportPredict AI — connecteurs de données.

    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch { return false; } },

      const msg = e.name === 'AbortError' ? 'délai dépassé (25 s)' : (e.message || String(e));
      setStatus(provider, false, msg);

      if (m) return { ok: true, data: m.data, at: m.at, cached: true, stale: true, error: msg, headers: m.headers || {} };
      return { ok: false, error: msg };

  function isoNoMs(d) { return new Date(d).toISOString().replace(/\.\d{3}Z$/, 'Z'); }
  async function oddsFor(key, sportKey, { regions, markets, hours = 48, ttlMin = 10 }) {
    const from = isoNoMs(Date.now()), to = isoNoMs(Date.now() + hours * 3600e3);
    const q = `regions=${regions}&markets=${markets}&oddsFormat=decimal&dateFormat=iso&commenceTimeFrom=${from}&commenceTimeTo=${to}`;
    const ck = `odds:${sportKey}:${regions}:${markets}:${hours}`;

  }
  async function oddsScores(key, sportKey, daysFrom = 3) {
    return cachedJSON(`odds:scores:${sportKey}`, `${ODDS}/sports/${sportKey}/scores?apiKey=${encodeURIComponent(key)}&daysFrom=${daysFrom}&dateFormat=iso`, 30 * 60e3, 'The Odds API', { raw: true });
  }

  // ------------------------------------------------------------------ ESPN (public, sans clé)
  const ESPN = 'https://site.api.espn.com/apis/site/v2/sports';
  const ymd = (d) => new Date(d).toISOString().slice(0, 10).replace(/-/g, '');
  function parseEspnEvents(data) {
    const out = [];
    for (const ev of data?.events || []) {
      const c = ev.competitions?.[0]; if (!c) continue;
      const home = c.competitors?.find((x) => x.homeAway === 'home'), away = c.competitors?.find((x) => x.homeAway === 'away');
      if (!home || !away) continue;
      out.push({
        id: ev.id, t: Date.parse(ev.date), completed: !!ev.status?.type?.completed, state: ev.status?.type?.state,
        h: home.team?.displayName, a: away.team?.displayName,
        hs: home.score != null ? +home.score : null, as: away.score != null ? +away.score : null,
        venue: c.venue?.fullName || null,
      });

  }
  // Résultats d'une période, découpée en tranches (ESPN limite le volume par requête).
  // Résultats d'une période. Certaines ligues ESPN (NBA) refusent les plages de dates (« HTTP 400 ») :
  // perDay interroge alors jour par jour (dates=AAAAMMJJ), 6 requêtes en parallèle, avec cache long pour le passé.
  async function espnResults(sport, league, fromMs, toMs, chunkDays, perDay = false) {
    const all = []; const errors = [];
    if (perDay) {
      const days = [];
      for (let s = fromMs; s <= toMs; s += 86400e3) days.push(s);
      for (let i = 0; i < days.length; i += 6) {
        const rs = await Promise.all(days.slice(i, i + 6).map((s) => cachedJSON(`espn:${sport}:${league}:d${ymd(s)}`,
          `${ESPN}/${sport}/${league}/scoreboard?dates=${ymd(s)}`, s < Date.now() - 2 * 86400e3 ? 60 * 86400e3 : 3 * 3600e3, 'ESPN')));
        for (const r of rs) { if (!r.ok) errors.push(r.error); else all.push(...parseEspnEvents(r.data)); }
      }
    } else {
      for (let s = fromMs; s < toMs; s += chunkDays * 86400e3) {
        const e = Math.min(toMs, s + (chunkDays - 1) * 86400e3);
        const past = e < Date.now() - 2 * 86400e3;
        const r = await cachedJSON(`espn:${sport}:${league}:${ymd(s)}-${ymd(e)}`,
          `${ESPN}/${sport}/${league}/scoreboard?dates=${ymd(s)}-${ymd(e)}&limit=1000`,
          past ? 30 * 86400e3 : 6 * 3600e3, 'ESPN');
        if (!r.ok) { errors.push(r.error); continue; }
        all.push(...parseEspnEvents(r.data));
      }
    }
    const seen = new Set();
    const games = all.filter((g) => g.completed && g.hs != null && !seen.has(g.id) && seen.add(g.id));
    return { games, errors, meta: meta('ESPN scoreboard', `${ESPN}/${sport}/${league}/scoreboard`) };
  }
  // Tableau des matchs autour d'une date : jour par jour (compatible avec toutes les ligues ESPN).
  async function espnScoreboard(sport, league, fromMs, toMs) {
    const evs = [], errs = [];
    let at = Date.now();
    for (let s = fromMs; s <= toMs + 1; s += 86400e3) {
      const r = await cachedJSON(`espn:sb:${sport}:${league}:d${ymd(s)}`, `${ESPN}/${sport}/${league}/scoreboard?dates=${ymd(s)}`, 15 * 60e3, 'ESPN');
      if (r.ok) { evs.push(...parseEspnEvents(r.data)); at = Math.min(at, r.at); } else errs.push(r.error);
    }
    if (!evs.length && errs.length) return { ok: false, error: errs[0] };
    const seen = new Set();
    return { ok: true, events: evs.filter((e) => !seen.has(e.id) && seen.add(e.id)), at };
  }
  async function espnSummary(sport, league, eventId) {

  async function localData() {

    'inter milan': 'internazionale', 'paris saint germain': 'paris saint-germain', 'psg': 'paris saint-germain',
    'athletic bilbao': 'athletic club', 'la clippers': 'los angeles clippers', 'man utd': 'manchester united',
    'man city': 'manchester city', 'wolves': 'wolverhampton wanderers', 'spurs': 'tottenham hotspur',

    'sevilla fc': 'sevilla', 'as roma': 'roma', 'ac milan': 'milan', 'olympique lyonnais': 'lyon',
    'olympique de marseille': 'marseille', 'brest': 'stade brestois', 'rennes': 'stade rennais',
    // noms courts de football-data.co.uk / ClubElo
    'man united': 'manchester united', 'nott m forest': 'nottingham forest', 'newcastle': 'newcastle united',
    'west ham': 'west ham united', 'tottenham': 'tottenham hotspur', 'brighton': 'brighton and hove albion', 'leeds': 'leeds united',
    'paris sg': 'paris saint-germain', 'paris saint germain': 'paris saint-germain', 'st etienne': 'saint etienne',
    'ath madrid': 'atletico de madrid', 'atletico madrid': 'atletico de madrid', 'ath bilbao': 'athletic club', 'bilbao': 'athletic club', 'sociedad': 'real sociedad', 'betis': 'real betis',
    'vallecano': 'rayo vallecano', 'espanol': 'espanyol', 'celta': 'celta', 'ein frankfurt': 'eintracht frankfurt', 'frankfurt': 'eintracht frankfurt',
    'm gladbach': 'borussia monchengladbach', 'gladbach': 'borussia monchengladbach', 'borussia m gladbach': 'borussia monchengladbach', 'leverkusen': 'bayer leverkusen', 'dortmund': 'borussia dortmund',
    'fc koln': 'koln', 'inter': 'internazionale', 'verona': 'hellas verona', 'sheffield united': 'sheffield united', 'qpr': 'queens park rangers',
  };
  function norm(s) {
    let x = (s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[&.'’-]/g, ' ').replace(/\s+/g, ' ').trim();
    if (ALIAS[x]) x = ALIAS[x];
    return x;
  }

  function sim(a, b) {

    for (const t of A) if (B.some((u) => u === t || (t.length > 3 && u.length > 3 && (u.startsWith(t) || t.startsWith(u))))) inter++;
    return inter / Math.max(A.length, B.length);

  let anthropicMod = null;
  async function claudeAnalyze(apiKey, payload) {

    const Anthropic = anthropicMod.default || anthropicMod.Anthropic;

    const schema = {
      type: 'object', additionalProperties: false,
      required: ['resume', 'facteurs_favorables', 'facteurs_defavorables', 'risques', 'contradictions', 'impact', 'sources_utilisees'],
      properties: {
        resume: { type: 'string' },
        facteurs_favorables: { type: 'array', items: { type: 'string' } },
        facteurs_defavorables: { type: 'array', items: { type: 'string' } },
        risques: { type: 'array', items: { type: 'string' } },
        contradictions: { type: 'array', items: { type: 'string' } },
        impact: { type: 'string', enum: ['aucun', 'mineur', 'majeur'] },
        sources_utilisees: { type: 'array', items: { type: 'string' } },

    const system = `Tu es l'analyste qualitatif de SportPredict AI. Tu reçois une sélection de pari déjà calculée par des modèles statistiques, ainsi que des titres d'actualité et des rapports de blessures horodatés, chacun avec un identifiant de source [S1], [S2]...
Règles :
- N'utilise QUE les informations fournies. N'invente aucune statistique, aucun nom, aucune blessure.
- Ne donne pas de probabilité et ne décide pas du résultat : tu identifies uniquement des facteurs et des risques.
- Chaque facteur ou risque cite l'identifiant de sa source, par exemple « [S3] ».
- Une rumeur ou une information non officielle est signalée comme telle.
- impact = "majeur" seulement si une information fournie peut changer sensiblement la probabilité (ex. absence confirmée ou incertaine d'un joueur clé, changement d'entraîneur, rotation annoncée) ; "aucun" si les sources ne disent rien de pertinent.
- Réponds en français, de façon concise.`;
    const res = await client.beta.messages.create({
      model: 'claude-opus-5-5',
      max_tokens: 4000,
      betas: ['server-side-fallback-2026-07-01'],
      fallbacks: 'default',
      output_config: { effort: 'low', format: { type: 'json_schema', schema } },
      system,
      messages: [{ role: 'user', content: JSON.stringify(payload) }],
    });
    if (res.stop_reason === 'refusal') throw new Error('analyse refusée par le modèle');
    const txt = (res.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('');
    setStatus('Claude', true, 'OK');
    return JSON.parse(txt);
  }

    LS, log, apiStatus, setStatus, meta, purgeCache, FOOTBALL,
    oddsSports, oddsFor, oddsEvent, oddsScores, oddsEventsList,
    espnResults, espnScoreboard, espnSummary, espnNews, nbaInjuries,
    norm, sim, bestMatch, claudeAnalyze, localData,
  };
})();

/* SportPredict AI — historique immuable, résultats, CLV et performance. */
const SPStore = (() => {
  const D = SPData;
  const K = { analyses: 'sp:analyses', picks: 'sp:picks', results: 'sp:results', clv: 'sp:clv' };
  const get = (k, d) => D.LS.get(k, d);

  function saveAnalysis(A) {
    // conserve les 30 dernières analyses détaillées (l'événementiel complet est volumineux)
    memLast = A; // l'analyse reste affichée même si le stockage du navigateur est plein
    let list = get(K.analyses, []);
    list.push(A);
    while (list.length > 20) list.shift();
    const slim = (a) => ({ ...a, events: (a.events || []).map((e) => ({ ...e, news: [], info: [], models: null, sels: (e.sels || []).filter((x) => x.deep).slice(0, 10), forecast: e.forecast ? { ...e.forecast, markets: undefined } : null })) });
    const steps = [
      () => list,
      () => { D.purgeCache(); return list; },
      () => list.map((a, i) => (i < list.length - 1 ? { ...a, events: [] } : a)),
      () => list.slice(-3).map((a, i, arr) => (i < arr.length - 1 ? { ...a, events: [] } : a)),
      () => [slim(A)],
      () => [{ ...A, events: [] }],
    ];
    A.storageOk = false;
    for (const st of steps) { const l = st(); if (D.LS.set(K.analyses, l)) { list = l; A.storageOk = true; break; } }
    // publication : les pronostics publiés ne sont jamais modifiés ensuite
    const picks = get(K.picks, []);
    const pub = [A.best, ...A.values].filter(Boolean).map((p) => ({ ...p, analysisId: A.id, parentId: A.parentId, publishedAt: A.finishedAt }));
    for (const p of pub) {
      // version : nombre de publications antérieures sur la même sélection du même événement
      p.version = picks.filter((x) => x.eventId === p.eventId && x.selId === p.selId).length + 1;
      picks.push(p);
    }
    if (!D.LS.set(K.picks, picks)) { D.purgeCache(); D.LS.set(K.picks, picks); }
    return pub;
  }
  const analyses = () => { const a = get(K.analyses, []); if (memLast && !a.some((x) => x.id === memLast.id)) a.push(memLast); return a; };
  let memLast = null;
  const lastAnalysis = () => { if (memLast) return memLast; const a = analyses(); return a[a.length - 1] || null; };
  const picks = () => get(K.picks, []);
  const results = () => get(K.results, {});
  const clv = () => get(K.clv, {});

  // Résultat : enregistré à part, le pronostic publié reste intact.
  function setResult(pid, r) {
    const all = results();
    if (all[pid] && !r.overwrite) return false;
    all[pid] = { ...r, at: Date.now() };
    D.LS.set(K.results, all);
    return true;
  }
  function recordCLV(pid, data) {
    const all = clv();
    all[pid] = { ...(all[pid] || {}), last: { ...data, at: Date.now() } };
    D.LS.set(K.clv, all);
  }

  // Règlement d'un pari à partir du score final.
  function settle(p, hs, as) {
    const SP = SPPipeline.SP;
    let sel;
    if (p.sport === 'tennis' || p.type === 'corners' || p.type === 'cards') return null; // pas de règlement automatique (score insuffisant)
    sel = SP.normalizeSel({ type: p.type, point: p.point });
    const sh = SP.settleShares(SP.selMargin(sel, hs, as), sel.line);
    const profit = sh.win * (p.odds - 1) - (1 - sh.win - sh.push);
    const status = sh.win === 1 ? 'gagné' : sh.push === 1 ? 'remboursé' : sh.win === 0.5 ? 'demi-gagné' : (sh.push === 0.5 ? 'demi-perdu' : 'perdu');
    return { status, profit, score: `${hs}-${as}`, win: sh.win, push: sh.push };
  }
  async function autoSettle() {
    const pend = picks().filter((p) => !results()[p.pid] && p.t < Date.now() - 2.5 * 3600e3 && p.sport !== 'tennis');
    let n = 0;
    const groups = new Map();
    for (const p of pend) {
      const lg = p.sport === 'nba' ? ['basketball', 'nba'] : ['soccer', D.FOOTBALL[p.sportKey]?.espn];
      if (!lg[1]) continue;
      const key = lg.join('|') + '|' + new Date(p.t).toISOString().slice(0, 10);
      if (!groups.has(key)) groups.set(key, { lg, t: p.t, list: [] });
      groups.get(key).list.push(p);
    }
    for (const g of groups.values()) {
      const sb = await D.espnScoreboard(g.lg[0], g.lg[1], g.t - 86400e3, g.t + 86400e3);
      if (!sb.ok) continue;
      for (const p of g.list) {
        const ev = sb.events.find((x) => x.completed && D.sim(x.h, p.home) >= 0.5 && D.sim(x.a, p.away) >= 0.5 && Math.abs(x.t - p.t) < 36 * 3600e3);
        if (!ev) continue;
        const r = settle(p, ev.hs, ev.as);
        if (r && setResult(p.pid, { ...r, source: 'ESPN scoreboard (automatique)', espnId: ev.id })) n++;
      }
    }
    return n;
  }

  // Performance : mise fixe d'une unité par pronostic publié.
  function perf(days) {
    const R = results(), CL = clv();
    const since = days ? Date.now() - days * 86400e3 : 0;
    const ps = picks().filter((p) => p.publishedAt >= since);
    const settled = ps.filter((p) => R[p.pid] && R[p.pid].status !== 'annulé');
    const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
    const profit = sum(settled, (p) => R[p.pid].profit);
    const wins = settled.filter((p) => R[p.pid].win > 0).length;
    const bin = settled.filter((p) => R[p.pid].push === 0 && (R[p.pid].win === 0 || R[p.pid].win === 1));
    const brier = bin.length ? sum(bin, (p) => (p.p - R[p.pid].win) ** 2) / bin.length : null;
    const logloss = bin.length ? sum(bin, (p) => -Math.log(Math.max(1e-9, R[p.pid].win ? p.p : 1 - p.p))) / bin.length : null;
    const brierMkt = bin.filter((p) => p.pMkt != null).length ? sum(bin.filter((p) => p.pMkt != null), (p) => (p.pMkt - R[p.pid].win) ** 2) / bin.filter((p) => p.pMkt != null).length : null;
    const clvs = ps.map((p) => CL[p.pid]?.last).filter((x) => x && x.fair);
    const clvAvg = clvs.length ? sum(ps.filter((p) => CL[p.pid]?.last?.fair), (p) => p.odds * CL[p.pid].last.fair - 1) / clvs.length : null;
    const group = (f) => {
      const m = {};
      for (const p of settled) { const k = f(p); m[k] = m[k] || { n: 0, profit: 0, wins: 0 }; m[k].n++; m[k].profit += R[p.pid].profit; m[k].wins += R[p.pid].win > 0 ? 1 : 0; }
      return m;
    };
    const curve = []; let cum = 0;
    for (const p of [...settled].sort((a, b) => a.t - b.t)) { cum += R[p.pid].profit; curve.push({ t: p.t, v: cum }); }
    // poids du marché suggéré (non appliqué automatiquement) : minimise la log-loss sur l'historique
    const both = bin.filter((p) => p.pMkt != null && p.pStats != null);
    let wSuggest = null;
    if (both.length >= 50) {
      let best = null;
      for (let w = 0; w <= 1.0001; w += 0.05) {
        const ll = sum(both, (p) => { const q = w * p.pMkt + (1 - w) * p.pStats; return -Math.log(Math.max(1e-9, R[p.pid].win ? q : 1 - q)); });
        if (!best || ll < best.ll) best = { ll, w: Math.round(w * 100) / 100 };
      }
      wSuggest = { ...best, n: both.length };
    }
    return {
      n: ps.length, settled: settled.length, pending: ps.length - settled.length, wins, hit: settled.length ? wins / settled.length : null,
      profit, yield: settled.length ? profit / settled.length : null, roiBank: profit / 100, avgOdds: settled.length ? sum(settled, (p) => p.odds) / settled.length : null,
      brier, logloss, brierMkt, clv: clvAvg, nClv: clvs.length,
      bySport: group((p) => p.sport), byMarket: group((p) => p.market), byMonth: group((p) => new Date(p.t).toISOString().slice(0, 7)),
      curve, calibration: SPPipeline.SP.calibrationBins(bin.map((p) => p.p), bin.map((p) => R[p.pid].win)), wSuggest,
    };
  }

  function exportAll() {
    return JSON.stringify({ format: 'sportpredict-v1', exportedAt: new Date().toISOString(), analyses: analyses(), picks: picks(), results: results(), clv: clv(), mybets: D.LS.get('sp:mybets', []), bank: D.LS.get('sp:bank', null) });
  }
  function importAll(txt) {
    const d = JSON.parse(txt);
    if (d.format !== 'sportpredict-v1') throw new Error('format de fichier inconnu');
    // fusion sans écrasement des pronostics existants
    const have = new Set(picks().map((p) => p.pid));
    D.LS.set(K.picks, [...picks(), ...d.picks.filter((p) => !have.has(p.pid))]);
    D.LS.set(K.results, { ...d.results, ...results() });
    D.LS.set(K.clv, { ...d.clv, ...clv() });
    if (d.mybets) { const mine = D.LS.get('sp:mybets', []); const ids = new Set(mine.map((b) => b.id)); D.LS.set('sp:mybets', [...mine, ...d.mybets.filter((b) => !ids.has(b.id))]); }
    if (d.bank && !D.LS.get('sp:bank', null)) D.LS.set('sp:bank', d.bank);
    const ha = new Set(analyses().map((a) => a.id));
    D.LS.set(K.analyses, [...d.analyses.filter((a) => !ha.has(a.id)).map((a) => ({ ...a, events: [] })), ...analyses()].slice(-30));
  }
  return { saveAnalysis, analyses, lastAnalysis, picks, results, clv, setResult, recordCLV, autoSettle, perf, exportAll, importAll, settle };
})();

<script>
/* SportPredict AI — pipeline d'analyse (phase 1 présélection, phase 2 approfondie). */
const SPPipeline = (() => {
  const SP = SPEngineFactory();
  const D = SPData;
  const DAY = 86400e3;

  // ------------------------------------------------------------ configuration
  const DEFAULT_CFG = {
    oddsKey: '', claudeKey: '', regions: 'eu', markets: 'h2h,totals,spreads', targetBook: 'winamax_fr',
    leagues: Object.fromEntries(Object.entries(D.FOOTBALL).map(([k, v]) => [k, v.on])),
    tennis: true, nba: true, maxTennisTournaments: 4,
    footballScope: 'principal', basketScope: 'principal', creditBudget: 45, excluded: [], included: [],
    wMarket: 0.65, minEV: 0.02, minOdds: 1.20, maxOdds: 3.5, prefLo: 1.40, prefHi: 2.20,
    bankroll: 100, kellyFrac: 0.25, maxStakePct: 0.02, mode: 'sûr', safeMinP: 0.70, safeMaxOdds: 1.70, safeTolEV: -0.03, safeStakePct: 0.02, maxOddsAgeMin: 45, maxGap: 0.10, maxSims: 1000000, minSims: 100000, tol: 0.0015, phase2Events: 14,
    hours: 24, extendTo48: true, autoOn: false, autoTime: '09:00', notif: false, preMatchRecheck: false,
  };
  function cfg() {
    const c = { ...DEFAULT_CFG, ...D.LS.get('sp:cfg', {}) };
    c.leagues = { ...DEFAULT_CFG.leagues, ...(c.leagues || {}) };
    return c;
  }
  function saveCfg(c) { D.LS.set('sp:cfg', c); }

  // ------------------------------------------------------------ workers Monte-Carlo
  let pool = null;
  function makePool() {
    const src = `${SPEngineFactory.toString()}
const SP = SPEngineFactory();
onmessage = (e) => {
  const { id, spec, sel } = e.data;
  const key = (x, y, w) => {
    const m = sel.type === 'spread' ? SP.selMargin(sel, x - y, 0, w) : SP.selMargin(sel, x, y, w);
    return SP.settleShares(m, sel.line).win > 0.5;
  };
  try {
    const out = SP.simulate({ ...spec, keyEvent: key }, (n) => postMessage({ id, progress: n }));
    postMessage({ id, done: out });
  } catch (err) { postMessage({ id, error: String(err) }); }
};`;
    const url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
    const n = Math.max(1, Math.min(4, (navigator.hardwareConcurrency || 2) - 1));
    const workers = Array.from({ length: n }, () => new Worker(url));
    return { workers, n };
  }
  function runSims(tasks, onProgress) {
    if (!pool) pool = makePool();
    return new Promise((resolve) => {
      const results = new Array(tasks.length);
      let next = 0, done = 0, simsDone = 0;
      const live = new Map();
      if (!tasks.length) return resolve(results);
      const start = (w) => {
        if (next >= tasks.length) return;
        const i = next++;
        live.set(i, 0);
        w.onmessage = (e) => {
          const m = e.data;
          if (m.progress != null) { live.set(i, m.progress); onProgress && onProgress(done, tasks.length, simsDone + [...live.values()].reduce((a, b) => a + b, 0)); return; }
          live.delete(i);
          results[i] = m.done || { error: m.error };
          if (m.done) simsDone += m.done.n;
          done++;
          onProgress && onProgress(done, tasks.length, simsDone);
          if (done === tasks.length) resolve(results); else start(w);
        };
        w.postMessage({ id: i, spec: tasks[i].spec, sel: tasks[i].sel });
      };
      pool.workers.forEach(start);
    });
  }

  // Compétitions principales (régulières, bien couvertes) : les seules interrogées par défaut.
  const FOOT_MAIN = new Set(['soccer_france_ligue_one', 'soccer_epl', 'soccer_spain_la_liga', 'soccer_italy_serie_a', 'soccer_germany_bundesliga',
    'soccer_uefa_champs_league', 'soccer_uefa_europa_league', 'soccer_uefa_europa_conference_league',
    'soccer_france_ligue_two', 'soccer_efl_champ', 'soccer_netherlands_eredivisie', 'soccer_portugal_primeira_liga']);
  const BASKET_MAIN = new Set(['basketball_nba', 'basketball_euroleague']);
  const groupOfSport = (s) => (s.group === 'Soccer' ? 'football' : s.group === 'Basketball' ? 'basket' : s.group === 'Tennis' ? 'tennis' : null);
  function isDefault(s, C) {
    const g = groupOfSport(s);
    if (g === 'football') return C.footballScope === 'toutes' || FOOT_MAIN.has(s.key);
    if (g === 'basket') return C.basketScope === 'toutes' || BASKET_MAIN.has(s.key);
    if (g === 'tennis') return !!C.tennis;
    return false;
  }
  function isWanted(s, C) {
    if (!groupOfSport(s) || !s.active || s.has_outrights) return false;
    if ((C.excluded || []).includes(s.key)) return false;
    if ((C.included || []).includes(s.key)) return true;
    return isDefault(s, C);
  }

  // ------------------------------------------------------------ marchés
  function buildMarkets(ev) {
    const mk = { h2h: new Map(), totals: new Map(), spreads: new Map() };
    let sharp = null;
    for (const b of ev.bookmakers || []) {
      for (const m of b.markets || []) {
        if (!mk[m.key]) continue;
        // regroupe par ligne : h2h -> 'main' ; totals -> point ; spreads -> point du domicile/joueur A
        const groups = new Map();
        for (const o of m.outcomes) {
          let g = 'main';
          if (m.key === 'totals') g = String(o.point);
          if (m.key === 'spreads') g = String(o.name === ev.home_team ? o.point : -o.point);
          if (!groups.has(g)) groups.set(g, []);
          groups.get(g).push(o);
        }
        for (const [g, outs] of groups) {
          if (!mk[m.key].has(g)) mk[m.key].set(g, { line: g, books: [] });
          mk[m.key].get(g).books.push({ book: b.key, title: b.title, last: Date.parse(m.last_update || b.last_update), outs });
        }
      }
      if (b.key === 'pinnacle' || (b.key === 'betfair_ex_eu' && !sharp)) sharp = b.key;
    }
    // sélections
    const sels = [];
    const label = (mkey, o, g) => {
      if (mkey === 'h2h') return o.name === 'Draw' ? 'Match nul' : `${o.name} gagne`;
      if (mkey === 'totals') return `${o.name === 'Over' ? 'Plus' : 'Moins'} de ${o.point}`;
      return `${o.name} ${o.point > 0 ? '+' : ''}${o.point}`;
    };
    for (const mkey of ['h2h', 'totals', 'spreads']) {
      for (const [g, grp] of mk[mkey]) {
        const names = [...new Set(grp.books.flatMap((b) => b.outs.map((o) => o.name)))];
        const nOut = mkey === 'h2h' ? (names.includes('Draw') ? 3 : 2) : 2;
        // probabilité juste par livre (marge retirée), uniquement si le livre couvre toutes les issues
        const fairByBook = [];
        for (const b of grp.books) {
          if (b.outs.length !== nOut) continue;
          const pr = SP.devig(b.outs.map((o) => o.price));
          if (!pr) continue;
          fairByBook.push({ book: b.book, p: Object.fromEntries(b.outs.map((o, i) => [o.name, pr[i]])), margin: SP.overround(b.outs.map((o) => o.price)) });
        }
        for (const name of names) {
          const offers = [];
          for (const b of grp.books) {
            const o = b.outs.find((x) => x.name === name); if (!o) continue;
            offers.push({ book: b.book, title: b.title, price: o.price, point: o.point, last: b.last });
          }
          if (!offers.length) continue;
          offers.sort((x, y) => y.price - x.price);
          // référence « sharp » : Pinnacle, sinon Betfair Exchange (marge très faible), sinon consensus
          const pin = fairByBook.find((f) => f.book === 'pinnacle') || fairByBook.find((f) => f.book === 'betfair_ex_eu');
          const fps = fairByBook.map((f) => f.p[name]).filter((x) => x != null);
          const fair = pin ? pin.p[name] : (fps.length ? SP.median(fps) : null);
          const o0 = offers[0];
          let type;
          if (mkey === 'h2h') type = name === 'Draw' ? 'draw' : (name === ev.home_team ? 'home' : 'away');
          if (mkey === 'totals') type = name === 'Over' ? 'over' : 'under';
          if (mkey === 'spreads') type = name === ev.home_team ? 'ahHome' : 'ahAway';
          sels.push({
            id: `${mkey}|${g}|${name}`, mkey, line: g, name, type, point: o0.point ?? null,
            label: label(mkey, { name, point: o0.point }, g), offers, best: o0, second: offers[1] || null,
            mean: offers.reduce((s, x) => s + x.price, 0) / offers.length,
            fairMkt: fair, fairSource: pin ? `${pin.book === 'pinnacle' ? 'Pinnacle' : 'Betfair Exchange'} (marge retirée)` : (fps.length ? `consensus de ${fps.length} bookmakers (médiane, marge retirée)` : 'indisponible'),
            fairSd: SP.sd(fps), nBooks: offers.length,
            pinnacle: offers.find((x) => x.book === 'pinnacle')?.price || null,
          });
        }
      }
    }
    return { sels, sharp, nBooks: (ev.bookmakers || []).length };
  }

  // Bookmaker cible (Winamax par défaut) : la value est calculée à SA cote. Le prix juste reste
  // estimé sur tout le marché (Pinnacle en priorité) ; la meilleure cote ailleurs est conservée pour information.
  function applyTarget(mk, target) {
    if (!target) return mk;
    for (const s of mk.sels) {
      const t = s.offers.find((o) => o.book === target);
      if (!t) { s.noTarget = true; continue; }
      s.bestAny = s.best;
      s.best = t;
      s.second = s.offers.find((o) => o.book !== target) || null;
      mk.hasTarget = true;
    }
    return mk;
  }

  // ------------------------------------------------------------ données statistiques
  async function footballStats(espnLeague, step, oddsKey) {
    const L = await D.localData();
    const fd = L.football?.leagues?.[oddsKey];
    if (fd && fd.length >= 120) {
      const ms = fd.map(SP.fdRow);
      const xgInfo = SP.attachXG(ms);
      let nx = xgInfo.nReal + xgInfo.nProxy;
      const xgSource = xgInfo.label || null;
      const refs = [...new Set(ms.map((m) => m.refSrc).filter(Boolean))].join(' / ');
      await new Promise((res) => setTimeout(res, 0));
      const bt = SP.footballBacktest(ms);
      const dc = SP.fitDixonColes(ms);
      const xms = ms.filter((m) => m.hxg != null);
      const dcx = xms.length >= 100 ? SP.fitDixonColes(xms.map((m) => ({ ...m, hg: m.hxg, ag: m.axg })), { skipRho: true }) : null;
      return { ok: true, n: ms.length, nXG: nx, xgSource, refs, ms, dc, dcx, bt, errors: [], source: `football-data.co.uk${nx ? ` + ${xgSource} (${nx} matchs)` : ''}`, fetchedAt: L.football.fetchedAt };
    }
    const seasonStart = Date.UTC(new Date().getUTCFullYear() - (new Date().getUTCMonth() < 6 ? 2 : 1), 6, 15);
    const r = await D.espnResults('soccer', espnLeague, seasonStart, Date.now(), 45);
    if (!r.games.length) return { ok: false, error: r.errors[0] || 'aucun résultat renvoyé par ESPN' };
    const ms = r.games.map((g) => ({ t: g.t, h: g.h, a: g.a, hg: g.hs, ag: g.as })).sort((a, b) => a.t - b.t);
    await new Promise((res) => setTimeout(res, 0));
    const bt = ms.length >= 120 ? SP.footballBacktest(ms) : null;
    const dc = SP.fitDixonColes(ms);
    step && step.note(`${espnLeague}: ${ms.length} matchs`);
    return { ok: true, n: ms.length, ms, dc, bt, errors: r.errors, meta: r.meta, last: ms[ms.length - 1]?.t, source: 'ESPN' };
  }
  async function nbaStats() {
    const y = new Date().getUTCFullYear(), mo = new Date().getUTCMonth();
    const seasonStart = Date.UTC(mo >= 9 ? y - 1 : y - 2, 9, 15); // saison précédente + saison en cours
    // 1) résultats publiés chaque matin par le robot GitHub ; 2) secours : ESPN jour par jour sur 150 jours
    const L = await D.localData();
    let gs, source;
    if (L.nba?.games?.length >= 300) {
      gs = L.nba.games.map((r) => ({ t: r[0], h: r[1], a: r[2], hs: r[3], as: r[4] }));
      source = `ESPN via collecte quotidienne (${gs.length} matchs)`;
    } else {
      const r = await D.espnResults('basketball', 'nba', Math.max(seasonStart, Date.now() - 150 * 86400e3), Date.now(), 1, true);
      if (!r.games.length) return { ok: false, error: r.errors[0] || 'aucun résultat renvoyé par ESPN' };
      gs = r.games.map((g) => ({ t: g.t, h: g.h, a: g.a, hs: g.hs, as: g.as }));
      source = `ESPN jour par jour (${gs.length} matchs)`;
    }
    gs.sort((a, b) => a.t - b.t);
    await new Promise((res) => setTimeout(res, 0));
    const bt = gs.length >= 300 ? SP.nbaBacktest(gs) : null;
    const m = SP.fitNBA(gs);
    const elo = bt ? bt.elo : SP.eloRun(gs.map((g) => ({ h: g.h, a: g.a, hg: g.hs, ag: g.as })), { K: 20, home: 70 });
    return { ok: true, n: gs.length, gs, model: m, bt, elo, errors: [], source };
  }

  // Index des joueurs tennis-data (« Sinner J. ») -> clé « nom|initiale »

      map[tour] = new Map();
      for (const [name, v] of Object.entries(t.players)) {
        const tok = D.norm(name).replace(/\./g, '').split(' ').filter(Boolean);
        if (tok.length < 2) continue;
        const ini = tok[tok.length - 1][0];
        map[tour].set(tok.slice(0, -1).join(' ') + '|' + ini, { name, ...v });

  }

    const tok = D.norm(oddsName).split(' ').filter(Boolean);

    const h2h = E.mk.sels.filter((s) => s.mkey === 'h2h');

  // ------------------------------------------------------------ validation
  function assess(c, C, ctx) {
    const reasons = [], warn = [];
    const o = c.best.price;
    if (o < C.minOdds) reasons.push(`cote ${o.toFixed(2)} < minimum ${C.minOdds.toFixed(2)}`);
    if (o > C.maxOdds) reasons.push(`cote ${o.toFixed(2)} > plafond ${C.maxOdds.toFixed(2)}`);
    if (c.t <= Date.now() + 15 * 60e3) reasons.push('événement commencé ou trop proche du coup d’envoi');
    const ageMin = (Date.now() - c.best.last) / 60e3;
    if (!(ageMin <= C.maxOddsAgeMin)) reasons.push(`cote trop ancienne (${Math.round(ageMin)} min)`);
    if (c.ev <= 0) reasons.push('espérance négative');
    else if (c.ev < C.minEV) reasons.push(`EV ${(c.ev * 100).toFixed(1)}% < seuil ${(C.minEV * 100).toFixed(1)}%`);
    if (c.edge < c.uncert) reasons.push(`value (${(c.edge * 100).toFixed(1)} pts) inférieure à l’incertitude (${(c.uncert * 100).toFixed(1)} pts)`);
    if (C.targetBook && c.second && c.best.price / c.second.price > 1.07) warn.push(`${c.best.title} est ${((c.best.price / c.second.price - 1) * 100).toFixed(0)} % au-dessus du bookmaker suivant : vérifiez la cote sur le site avant de parier`);
    else if (c.second && c.best.book !== 'pinnacle' && c.best.price / c.second.price > 1.07) reasons.push(`cote isolée (${c.best.title} ${c.best.price} vs ${c.second.price} ailleurs) : possible erreur ou cote obsolète`);
    if (c.modelGap != null && c.modelGap > C.maxGap) reasons.push(`divergence modèles/marché de ${(c.modelGap * 100).toFixed(1)} pts non expliquée`);
    if (c.fairMkt == null && c.sport !== 'nba' && c.sport !== 'basket') reasons.push('probabilité de marché indisponible');
    if (c.simN && c.simCI > 0.01) reasons.push('simulations insuffisamment stables');
    if (c.mcSpread > 0.2) reasons.push('résultat trop sensible aux hypothèses (scénarios)');
    if (c.llm?.impact === 'majeur') reasons.push('information majeure à confirmer (analyse des actualités)');
    if (c.critical) reasons.push(c.critical);

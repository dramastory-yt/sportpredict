    for (let i = 0; i < plan.length; i++) {
      const x = plan[i];
      // marchés : complets pour les majeures, vainqueur + total pour les autres (2 crédits au lieu de 3)
      const markets = MAJOR.has(x.key) || x.group === 'tennis' ? C.markets : 'h2h,totals';
      const cost = markets.split(',').length * nRegions;
      if (spent + cost > C.creditBudget) { skippedBudget.push(titles[x.key] || x.key); continue; }
      if (opts.onlyKeys && !opts.onlyKeys.has(x.key)) continue;
      S.progress(0, i, plan.length, titles[x.key]);
      const r = await D.oddsFor(C.oddsKey, x.key, { regions: C.regions, markets, hours, ttlMin: opts.force ? 0 : 10 });
      if (!r.ok) { A.errors.push(`${titles[x.key]}: ${r.error}`); continue; }
      if (!r.cached) spent += cost;
      keys.push(x.key);
      if (C.targetBook && r.data.length) wmx[x.key] = { has: r.data.some((e) => (e.bookmakers || []).some((b) => b.key === C.targetBook)), at: Date.now() };
      raw.push(...r.data.map((e) => ({ ...e, _fetched: r.at, _stale: !!r.stale })));
    }
    D.LS.set('sp:wmx', wmx);
    A.coverage = { scanned: withCount.length, queried: keys.length, noEvents: skippedNoEvents, noTarget: skippedNoTarget, overBudget: skippedBudget, spent, competitions: keys.map((k2) => titles[k2] || k2) };
    A.counts.available = raw.length;
    A.sources.odds = { provider: 'The Odds API', regions: C.regions, at: Date.now(), remaining: D.apiStatus['The Odds API']?.remaining ?? null };
    S.done(0, `${raw.length} matchs à venir dans ${keys.length} compétitions (${withCount.length} actives scannées gratuitement ; ${skippedNoEvents} sans match, ${skippedNoTarget} sans cotes Winamax, ${skippedBudget.length} hors budget) · ${spent} crédits utilisés`, skippedBudget.length > 0);

    // ---------------- 2. statistiques
    S.start(1);
    const LD = await D.localData();
    scorersData = LD.scorers || null; localFootball = LD.football || null;
    A.sources.local = LD.meta ? { generatedAt: LD.meta.generatedAt, sources: LD.meta.sources } : null;
    const fbStats = {};
    const leaguesNeeded = [...new Set(raw.filter((e) => D.FOOTBALL[e.sport_key]?.stats).map((e) => e.sport_key))];
    let k = 0;
    for (const lk of leaguesNeeded) {
      S.progress(1, k++, leaguesNeeded.length + (C.nba ? 1 : 0), D.FOOTBALL[lk].name);
      try { fbStats[lk] = await footballStats(D.FOOTBALL[lk].espn, null, lk); } catch (e) { fbStats[lk] = { ok: false, error: String(e) }; }
      if (!fbStats[lk].ok) A.errors.push(`Stats ${D.FOOTBALL[lk].name}: ${fbStats[lk].error}`);
    }
    let nba = null;
    if (raw.some((e) => e.sport_key === 'basketball_nba')) {
      S.progress(1, k, leaguesNeeded.length + 1, 'NBA');
      try { nba = await nbaStats(); } catch (e) { nba = { ok: false, error: String(e) }; }
      if (!nba.ok) A.errors.push('Stats NBA : ' + nba.error);
    }
    A.backtests = {
      ...Object.fromEntries(Object.entries(fbStats).filter(([, v]) => v.ok && v.bt).map(([kk, v]) => [D.FOOTBALL[kk].name + ` (${v.source})`, { n: v.bt.n, models: { ...v.bt.models, ...(v.bt.market ? { [`marché (${v.refs || 'clôture'})`]: v.bt.market } : {}) }, ensemble: v.bt.blend || v.bt.ensemble, naive: v.bt.naive, weights: { ...v.bt.weights, ...(v.bt.wMarket != null ? { 'poids marché': v.bt.wMarket } : {}) }, calibration: v.bt.calibration }])),
      ...Object.fromEntries(Object.entries(LD.tennis?.tours || {}).map(([tour, t]) => [`Tennis ${tour} (Elo surface, ${LD.tennis.source || ''})`, { n: t.backtest.n || t.backtest.nElo || 0, models: { elo: { logLoss: t.backtest.eloLogLoss }, ...(t.backtest.pinnacleLogLoss != null ? { 'marché Pinnacle': { logLoss: t.backtest.pinnacleLogLoss } } : {}) }, ensemble: { logLoss: t.backtest.blendLogLoss ?? t.backtest.eloLogLoss }, naive: { logLoss: Math.log(2) }, weights: t.backtest.wMarket != null ? { 'poids marché': t.backtest.wMarket } : { 'poids marché': 1 } }])),
      ...(nba?.bt ? { NBA: { n: nba.bt.n, models: nba.bt.models, ensemble: nba.bt.ensemble, weights: nba.bt.weights, calibration: nba.bt.calibration } } : {}),
    };
    const okStats = Object.values(fbStats).filter((v) => v.ok).length + (nba?.ok ? 1 : 0);
    S.done(1, `${okStats} jeu(x) de données chargé(s) ; backtests : ${Object.keys(A.backtests).join(', ') || 'aucun'}`, okStats < leaguesNeeded.length + (nba ? 1 : 0));

    // ---------------- 3. blessures
    S.start(2);
    let inj = null;
    if (nba) { inj = await D.nbaInjuries(); if (!inj.ok) A.errors.push('Blessures NBA : ' + inj.error); }
    S.done(2, `NBA : ${inj?.ok ? 'rapport ESPN chargé' : 'indisponible'} · Football et tennis : pas de source gratuite structurée (signalé comme indisponible)`, !inj?.ok && !!nba);

    // préparation des événements
    const events = raw.map((e) => {
      const sport = e.sport_key.startsWith('soccer') ? 'football' : e.sport_key === 'basketball_nba' ? 'nba' : e.sport_key.startsWith('basketball') ? 'basket' : 'tennis';
      const E = {
        id: e.id, sport, sportKey: e.sport_key, comp: D.FOOTBALL[e.sport_key]?.name || titles[e.sport_key] || e.sport_title,
        home: e.home_team, away: e.away_team, t: Date.parse(e.commence_time), fetched: e._fetched, staleOdds: e._stale,
        mk: applyTarget(buildMarkets(e), C.targetBook), info: [], warnings: [], risk: 0,
      };
      E.day = new Date(E.t).toLocaleDateString('fr-FR', { timeZone: 'Europe/Paris' }) === new Date().toLocaleDateString('fr-FR', { timeZone: 'Europe/Paris' }) ? 'aujourd’hui' : 'demain';
      if (E.t - Date.now() > 24 * 3600e3) E.day = 'J+2';
      return E;
    });
    // blessures NBA par équipe
    if (inj?.ok) for (const E of events.filter((x) => x.sport === 'nba')) {
      for (const side of ['home', 'away']) {
        const m = D.bestMatch(E[side], Object.keys(inj.byTeam));
        const list = m.name ? inj.byTeam[m.name] : [];
        const unsure = list.filter((p) => /question|doubt|day-to-day|game time/i.test(p.status));
        const out = list.filter((p) => /^out/i.test(p.status));
        E.info.push({ kind: 'blessures', team: E[side], out, unsure, status: 'vérifié', source: 'ESPN NBA injuries', at: inj.at });
        if (unsure.length) { E.risk += Math.min(4, unsure.length * 1.5); E.warnings.push(`${E[side]} : ${unsure.length} joueur(s) incertain(s) (${unsure.map((p) => p.player).join(', ')}) — jamais considérés comme disponibles`); }
      }
    }

    // ---------------- 4. compositions
    S.start(3);
    let lineupsChecked = 0;
    const soon = events.filter((E) => E.sport === 'football' && E.t - Date.now() < 3 * 3600e3);
    for (const E of soon.slice(0, 12)) {
      const lg = D.FOOTBALL[E.sportKey]?.espn; if (!lg) continue;
      const sb = await D.espnScoreboard('soccer', lg, Date.now() - DAY, Date.now() + DAY);
      if (!sb.ok) continue;
      const ev = sb.events.find((x) => D.sim(x.h, E.home) >= 0.5 && D.sim(x.a, E.away) >= 0.5);
      if (!ev) continue;
      const sum = await D.espnSummary('soccer', lg, ev.id);
      lineupsChecked++;
      const rosters = sum.ok ? (sum.data.rosters || []) : [];
      const pub = rosters.some((r) => (r.roster || []).some((p) => p.starter));
      E.lineup = { status: pub ? 'vérifié' : 'indisponible', source: 'ESPN summary', at: Date.now(), espnId: ev.id };
      E.info.push({ kind: 'composition', status: pub ? 'vérifié' : 'indisponible', note: pub ? 'compositions officielles publiées' : 'compositions non publiées', source: 'ESPN', at: Date.now() });
    }
    for (const E of events.filter((x) => x.sport === 'football' && !x.lineup)) {
      E.info.push({ kind: 'composition', status: 'indisponible', note: 'compositions non encore publiées (habituellement ~1 h avant le match)', source: '—' });
      E.risk += 1.5;
    }
    S.done(3, `${lineupsChecked} match(s) proches vérifiés ; les autres : compositions non publiées`);

    // ---------------- 5. actualités
    S.start(4);
    const newsBy = {};
    const feeds = [...new Set(events.map((E) => E.sport === 'football' ? `soccer|${D.FOOTBALL[E.sportKey]?.espn}` : E.sport === 'nba' ? 'basketball|nba' : (/wta/.test(E.sportKey) ? 'tennis|wta' : 'tennis|atp')))].filter((f) => !f.endsWith('undefined'));
    for (let i = 0; i < feeds.length; i++) {
      S.progress(4, i, feeds.length, feeds[i]);
      const [s, l] = feeds[i].split('|');
      const r = await D.espnNews(s, l);
      newsBy[feeds[i]] = r.ok ? r.items : [];
      if (!r.ok) A.errors.push(`Actualités ${l} : ${r.error}`);
    }
    for (const E of events) {
      const f = E.sport === 'football' ? `soccer|${D.FOOTBALL[E.sportKey]?.espn}` : E.sport === 'nba' ? 'basketball|nba' : (/wta/.test(E.sportKey) ? 'tennis|wta' : 'tennis|atp');
      const items = newsBy[f] || [];
      const keyTok = (n) => D.norm(n).split(' ').filter((x) => x.length > 3).sort((a, b) => b.length - a.length)[0] || D.norm(n);
      const kh = keyTok(E.home), ka = keyTok(E.away);
      E.news = items.filter((it) => { const tx = D.norm(it.title + ' ' + it.desc); return tx.includes(kh) || tx.includes(ka); }).slice(0, 8);
    }
    S.done(4, `${feeds.length} flux ESPN ; ${events.reduce((s, E) => s + (E.news?.length || 0), 0)} articles reliés à des matchs`);

    // ---------------- 6. cotes
    S.start(5);
    let nMarkets = 0;
    for (const E of events) nMarkets += E.mk.sels.length;
    A.counts.markets = nMarkets;
    const withSharp = events.filter((E) => E.mk.sharp).length;
    const tgt = C.targetBook ? events.filter((E) => E.mk.hasTarget).length : null;
    if (C.targetBook && events.length && !tgt) A.errors.push(`Aucune cote ${C.targetBook} reçue : vérifiez la région (« eu » ou « fr ») dans Réglages`);
    S.done(5, `${tgt != null ? `${C.targetBook === 'winamax_fr' ? 'Winamax' : C.targetBook} présent sur ${tgt}/${events.length} événements · ` : ''}${nMarkets} sélections comparées sur ${events.reduce((s, E) => s + E.mk.nBooks, 0)} offres bookmakers ; Pinnacle présent sur ${withSharp}/${events.length} événements`);

    // ---------------- 7. modèles (phase 1 : présélection)
    S.start(6);
    const cands = [];
    const quickTennis = [];
    for (const E of events) {
      let M;
      try {
        if (E.sport === 'football') M = modelFootball(E, C, fbStats[E.sportKey], LD.clubelo);
        else if (E.sport === 'nba') M = modelNBA(E, C, nba);
        else if (E.sport === 'basket') M = modelNBA(E, C, null);
        else M = modelTennis(E, C, LD.tennis);
      } catch (err) { M = { error: String(err) }; }
      E.model = M;
      if (M.error) { E.skip = M.error; continue; }
      if (E.sport === 'tennis') quickTennis.push(E);
      else {
        for (const s of E.mk.sels) {
          if (s.noTarget) continue;
          const r = M.phase1(s);
          if (r.pWin == null) continue;
          Object.assign(s, { p1: r });
        }
      }
    }
    // tennis : simulation rapide 20 000 pour la présélection
    if (quickTennis.length) {
      const res = await runSims(quickTennis.map((E) => ({ spec: { ...E.model.simSpec, seed: hashSeed(E.id), minN: 20000, maxN: 20000, batch: 20000 }, sel: { type: 'tennisA', line: null } })));
      quickTennis.forEach((E, i) => {
        const simr = res[i]; if (!simr || simr.error) { E.skip = 'simulation échouée'; return; }
        for (const s of E.mk.sels) {
          const sel = tennisSel(E, s); if (!sel || s.noTarget) continue;
          const r = SP.evalFromSim(simr, SP.normalizeSel(sel), s.best.price);
          s.p1 = tennisBlend(s, r, C, E);
        }
      });
    }
    for (const E of events) for (const s of E.mk.sels) if (s.p1) cands.push({ E, s, ev1: s.p1.ev });
    A.counts.analysed = events.filter((E) => !E.skip).length;
    S.done(6, `${A.counts.analysed} événements modélisés (phase 1) ; ${events.filter((E) => E.skip).length} écartés faute de données`);

    // ---------------- 8. Monte-Carlo (phase 2 : approfondie)
    S.start(7);
    const byEvent = new Map();
    for (const c of cands) {
      if (c.s.best.price < C.minOdds || c.s.best.price > C.maxOdds) continue;
      const cur = byEvent.get(c.E.id);
      if (!cur || c.ev1 > cur.ev1) byEvent.set(c.E.id, c);
    }
    const top = [...byEvent.values()].filter((c) => c.ev1 > -0.04).sort((a, b) => b.ev1 - a.ev1).slice(0, C.phase2Events);
    const tasks = top.map((c) => {
      const sel = c.E.sport === 'tennis' ? tennisSel(c.E, c.s) : { type: c.s.type, point: c.s.point };
      return { spec: { ...c.E.model.simSpec, seed: hashSeed(c.E.id + c.s.id), minN: C.minSims, maxN: C.maxSims, tol: C.tol }, sel: SP.normalizeSel(sel) };
    });
    const simRes = await runSims(tasks, (d, n, sims) => S.progress(7, d, n, `${fmtInt(sims)} simulations`));
    let totalSims = 0;
    top.forEach((c, i) => {
      const r = simRes[i]; if (!r || r.error) { c.E.simError = r?.error || 'échec'; return; }
      c.E.sim = r; totalSims += r.n;
      for (const s of c.E.mk.sels) {
        const sel = c.E.sport === 'tennis' ? tennisSel(c.E, s) : { type: s.type, point: s.point };
        if (!sel || !s.p1) continue;
        const e = SP.evalFromSim(r, SP.normalizeSel(sel), s.best.price);
        s.p2 = c.E.sport === 'tennis' ? { ...tennisBlend(s, e, C, c.E), ci: e.ci95, n: r.n } : { pWin: e.pWin, pPush: e.pPush, ev: e.ev, ci: e.ci95, n: r.n };
      }
    });
    A.counts.sims = totalSims;
    S.done(7, `${top.length} événements approfondis · ${fmtInt(totalSims)} simulations (arrêt adaptatif, IC95 visé ±${(C.tol * 100).toFixed(2)} pt)`);

    // ---------------- 9. classement
    S.start(8);
    const scored = [];
    for (const E of events) {
      if (E.skip) continue;
      for (const s of E.mk.sels) {
        let p = s.p2 || s.p1; if (!p) continue;
        if (C.platt && p.pWin != null) { const q = SP.applyPlatt(C.platt, p.pWin); p = { ...p, pWin: q, ev: q * s.best.price + (p.pPush || 0) - 1 }; }
        const pStats = s.p1.pStats, pMkt = s.p1.pMkt;
        const modelGap = pStats != null && pMkt != null ? Math.abs(pStats - pMkt) : null;
        const ci = s.p2 ? s.p2.ci : 0.01;
        const uncert = Math.sqrt(ci ** 2 + (s.fairSd || 0.01) ** 2 + ((modelGap || 0) / 2) ** 2);
        const sc = E.sim?.scenarios?.map((x) => x.p).filter((x) => x != null) || [];
        const keySel = top.find((c) => c.E === E)?.s === s;
        const mcSpread = keySel && sc.length ? Math.max(...sc) - Math.min(...sc) : 0.05;
        const c = {
          E, s, sport: E.sport, t: E.t, best: s.best, second: s.second, fairMkt: s.fairMkt,
          p: p.pWin, pPush: p.pPush || 0, ev: p.ev, edge: p.pWin - 1 / s.best.price, uncert, modelGap, pStats, pMkt,
          simN: s.p2?.n || 0, simCI: s.p2?.ci ?? null, mcSpread,
          booksAtPrice: s.offers.filter((o) => o.price >= s.best.price - 1e-9).length,
        };
        const riskNote = [...E.warnings, ...(E.sport === 'football' && !E.lineup ? ['compositions non publiées'] : []), ...(E.staleOdds ? ['cotes issues du cache (fournisseur indisponible)'] : [])];
        if (E.staleOdds) c.critical = 'cotes non actualisées (fournisseur indisponible)';
        c.q = SP.qualityScore({
          edge: c.edge, uncert, modelGap, dataQuality: E.model.dataQuality, dataNote: E.model.statsNote, calib: E.model.calib,
          mcSpread, oddsAgeMin: (Date.now() - s.best.last) / 60e3, booksAtPrice: c.booksAtPrice, riskPenalty: E.risk, riskNote: riskNote.join(' ; '), odds: s.best.price,
        });
        c.check = assess(c, C, E);
        scored.push(c);
      }
    }
    A.counts.scored = scored.length;
    // pronostics : pour chaque match, la lecture du moteur, même sans value
    for (const E of events) {
      if (E.skip) continue;
      try { E.forecast = forecast(E, scored.filter((c) => c.E === E), E.sport === 'football' ? fbStats[E.sportKey] : E.sport === 'nba' ? nba : null); } catch (err) { E.forecast = null; }
    }
    const confRank = { forte: 3, moyenne: 2, faible: 1 };
    A.forecasts = events.filter((E) => E.forecast && E.forecast.pick && E.t - Date.now() <= Math.max(C.hours, 24) * 3600e3)
      .sort((a, b) => confRank[b.forecast.confidence] - confRank[a.forecast.confidence] || b.forecast.pick.p - a.forecast.pick.p)
      .slice(0, 20).map((E) => ({ eventId: E.id, sport: E.sport, sportKey: E.sportKey, home: E.home, away: E.away, comp: E.comp, match: `${E.home} – ${E.away}`, t: E.t, day: E.day, ...E.forecast }));
    S.done(8, `${scored.length} sélections notées ; ${scored.filter((c) => c.check.ok).length} passent les filtres`);

    // ---------------- 10. validation finale
    S.start(9);
    let valid = scored.filter((c) => c.check.ok && c.simN > 0);
    // une sélection par événement (la mieux notée), 48 h seulement si exceptionnelle
    const perEvent = new Map();
    for (const c of valid.sort((a, b) => b.q.total - a.q.total || b.ev - a.ev)) if (!perEvent.has(c.E.id)) perEvent.set(c.E.id, c);
    valid = [...perEvent.values()].filter((c) => c.E.t - Date.now() <= C.hours * 3600e3 || c.q.total >= 75);
    // analyse qualitative (facultative) des meilleures sélections
    if (C.claudeKey && valid.length) {
      const top6 = valid.slice(0, 6);
      for (let i = 0; i < top6.length; i++) {
        S.progress(9, i, top6.length, 'analyse des actualités (Claude)');
        const c = top6[i];
        try { c.llm = await D.claudeAnalyze(C.claudeKey, llmPayload(c)); } catch (e) { c.llmError = String(e.message || e); D.setStatus('Claude', false, c.llmError); }
        c.check = assess(c, C, c.E);
      }
      valid = valid.filter((c) => c.check.ok);
    }
    // re-vérification : l'événement n'a pas commencé, la cote est toujours fraîche
    valid = valid.filter((c) => c.E.t > Date.now() + 15 * 60e3);
    valid.sort((a, b) => b.q.total - a.q.total || b.ev - a.ev);
    A.best = valid[0] ? pack(valid[0], 'best') : null;
    A.values = valid.slice(1, 6).map((c) => pack(c, 'value'));
    // opportunités à surveiller
    const watch = [];
    const usedEv = new Set(valid.slice(0, 6).map((c) => c.E.id));
    for (const c of scored.sort((a, b) => b.ev - a.ev)) {
      if (usedEv.has(c.E.id) || watch.length >= 5) continue;
      if (c.best.price < C.minOdds || c.best.price > C.maxOdds || c.E.t <= Date.now() + 15 * 60e3) continue;
      const need = [];
      const reqOdds = (1 + C.minEV) / c.p;
      if (c.ev < C.minEV && c.ev > -0.04) need.push(`cote ≥ ${reqOdds.toFixed(2)} (actuellement ${c.best.price.toFixed(2)} chez ${c.best.title})`);
      if (c.E.sport === 'football' && !c.E.lineup) need.push('composition officielle (~1 h avant) confirmant les titulaires');
      if (c.E.warnings.length) need.push('statut des joueurs incertains confirmé');
      if (c.check.reasons.some((r) => r.startsWith('divergence'))) need.push('explication de l’écart entre modèles et marché (blessure, rotation…)');
      if (c.llm?.impact === 'majeur') need.push('confirmation de l’information signalée dans les actualités');
      if (!need.length || c.ev < -0.04 || c.check.reasons.some((r) => /isolée|ancienne|commencé/.test(r))) continue;
      usedEv.add(c.E.id);
      watch.push({ ...pack(c, 'watch'), need });
    }
    A.watch = watch;
    // combiné : uniquement s'il bat chaque simple (sélections d'événements différents)
    if (valid.length >= 2) {
      const [a, b] = valid;
      const pj = a.p * b.p, oj = a.best.price * b.best.price, evj = pj * oj - 1;
      // rémunération du risque : EV / écart-type du rendement (un combiné augmente toujours l'EV brute)
      const ratio = (p, o) => (p * o - 1) / (o * Math.sqrt(p * (1 - p)));
      const rj = ratio(pj, oj), rs = Math.max(ratio(a.p, a.best.price), ratio(b.p, b.best.price));
      if (rj > rs && pj >= 0.3 && a.E.id !== b.E.id) A.combo = { legs: [pack(a), pack(b)], p: pj, odds: oj, ev: evj, ratio: rj, ratioSingles: rs, note: 'Événements distincts supposés indépendants (matchs différents). Retenu car son EV rapportée au risque dépasse celle des paris simples.' };
      else A.comboRejected = `combiné étudié (${a.E.home}/${b.E.home}) : EV ${(evj * 100).toFixed(1)} % mais rapport EV/risque ${rj.toFixed(3)} ≤ ${rs.toFixed(3)} pour le meilleur simple — non retenu`;
    }
    // PARIS SÛRS : très probables (≥ safeMinP), cote modérée, et cote Winamax pas en dessous de sa vraie valeur
    // (EV ≥ 0 = « cote correcte » ; légèrement négative jusqu'à safeTolEV = « cote un peu basse »).
    {
      const byEv = new Map();
      for (const c of scored) {
        const E = c.E;
        if (c.s.noTarget || c.p == null || c.p < C.safeMinP) continue;
        if (c.best.price < C.minOdds || c.best.price > C.safeMaxOdds) continue;

      eventId: E.id, sportKey: E.sportKey, t: E.t, day: E.day, market: c.s.mkey, selId: c.s.id, label: c.s.label, type: c.s.type, point: c.s.point, side: c.s.name,
      odds: c.best.price, book: c.best.title, bookKey: c.best.book, oddsAt: c.best.last, second: c.second?.price || null,
      p: c.p, pPush: c.pPush, pImplied: 1 / c.best.price, pMkt: c.pMkt, pStats: c.pStats, fairSource: c.s.fairSource,
      ev: c.ev, edge: c.edge, uncert: c.uncert, modelGap: c.modelGap, sims: c.simN, ci: c.simCI,
      score: c.q.total, scoreParts: c.q.parts, reasons: c.check.reasons, warnings: c.check.warn,
      scenarios: E.sim?.scenarios || null, models: E.model.models, statsNote: E.model.statsNote, ctx: E.model.ctx || null,
      info: E.info, news: E.news || [], llm: c.llm || null, llmError: c.llmError || null,
      offers: c.s.offers.slice(0, 8).map((o) => ({ title: o.title, price: o.price, last: o.last })), bestAny: c.s.bestAny ? { title: c.s.bestAny.title, price: c.s.bestAny.price } : null,
      seed: E.sim?.seed ?? null, engine: SP.version, wMarket: cfg().wMarket,
    };
  }
  function slimEvent(E) {
    return {
      id: E.id, sport: E.sport, sportKey: E.sportKey, comp: E.comp, home: E.home, away: E.away, t: E.t, day: E.day, skip: E.skip || null,
      statsNote: E.model?.statsNote || null, models: E.model?.models || null, ctx: E.model?.ctx || null, warnings: E.warnings, info: E.info, news: E.news || [],
      sims: E.sim ? { n: E.sim.n, ms: E.sim.ms, scenarios: E.sim.scenarios, key: E.sim.key } : null, spec: E.model?.simSpec || null, wSource: E.model?.wSource || null, forecast: E.forecast || null,
      sels: E.mk.sels.map((s) => ({
        id: s.id, mkey: s.mkey, label: s.label, best: s.noTarget ? null : s.best.price, book: s.noTarget ? 'non proposé par le bookmaker cible' : s.best.title, anyBest: s.bestAny?.price ?? s.best.price, last: s.best.last, nBooks: s.nBooks, mean: s.mean, pin: s.pinnacle,
        fair: s.fairMkt, p: (s.p2 || s.p1)?.pWin ?? null, ev: (s.p2 || s.p1)?.ev ?? null, deep: !!s.p2,
      })),
    };
  }
  function finish(A, ui) {
    A.finishedAt = A.finishedAt || Date.now();
    SPStore.saveAnalysis(A);
    ui.onDone && ui.onDone(A);
    return A;
  }
  function hashSeed(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  const fmtInt = (n) => new Intl.NumberFormat('fr-FR').format(n);

  return { run, cfg, saveCfg, DEFAULT_CFG, SP, tennisContext, runSims, isDefault, isWanted };
})();

<script>
/* SportPredict AI — vérificateur de cote (cotes boostées, marchés absents de l'API). */
const SPChecker = (() => {
  const D = SPData, P = SPPipeline, S = SPStore, SP = P.SP;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (x, d = 1) => (x == null || isNaN(x) ? '—' : (x * 100).toFixed(d) + ' %');
  const sgn = (x) => (x == null || isNaN(x) ? '—' : (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + ' %');
  const TZ = 'Europe/Paris';
  const dt = (t) => new Date(t).toLocaleString('fr-FR', { timeZone: TZ, weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });

  // marché -> { libellé, type moteur, ligne requise, validation }
  // « backtest » : probabilité issue du mélange marché/modèles validé contre les cotes de clôture.
  // « modèle » : dérivé des mêmes paramètres mais jamais comparé à un marché réel -> exigence d'EV doublée.
  const MARKETS = {
    football: [
      ['1', 'Victoire domicile', 'home', false, 'backtest'], ['N', 'Match nul', 'draw', false, 'backtest'], ['2', 'Victoire extérieur', 'away', false, 'backtest'],
      ['1N', 'Double chance 1N', 'dc1X', false, 'backtest'], ['N2', 'Double chance N2', 'dcX2', false, 'backtest'], ['12', 'Double chance 12', 'dc12', false, 'backtest'],
      ['dnb1', 'Remboursé si nul : domicile', 'ahHome', false, 'backtest', 0], ['dnb2', 'Remboursé si nul : extérieur', 'ahAway', false, 'backtest', 0],
      ['over', 'Plus de X buts', 'over', true, 'modèle'], ['under', 'Moins de X buts', 'under', true, 'modèle'],
      ['bttsY', 'Les deux équipes marquent : oui', 'bttsYes', false, 'modèle'], ['bttsN', 'Les deux équipes marquent : non', 'bttsNo', false, 'modèle'],
      ['ah1', 'Handicap domicile (ex. -1.5)', 'ahHome', true, 'modèle'], ['ah2', 'Handicap extérieur (ex. +1.5)', 'ahAway', true, 'modèle'],
      ['HS', 'Équipe domicile marque', 'homeTotalOver', false, 'modèle'], ['AS', 'Équipe extérieur marque', 'awayTotalOver', false, 'modèle'],
      ['HCS', 'Domicile ne prend pas de but', 'homeCS', false, 'modèle'], ['ACS', 'Extérieur ne prend pas de but', 'awayCS', false, 'modèle'],
      ['HO15', 'Domicile gagne et +1,5 buts', 'homeAndOver15', false, 'modèle'], ['AO15', 'Extérieur gagne et +1,5 buts', 'awayAndOver15', false, 'modèle'],
    ],
    nba: [
      ['home', 'Victoire domicile', 'home', false, 'backtest'], ['away', 'Victoire extérieur', 'away', false, 'backtest'],
      ['ahH', 'Handicap domicile (ex. -4.5)', 'ahHome', true, 'modèle'], ['ahA', 'Handicap extérieur (ex. +4.5)', 'ahAway', true, 'modèle'],
      ['over', 'Plus de X points', 'over', true, 'modèle'], ['under', 'Moins de X points', 'under', true, 'modèle'],
    ],
    basket: null,
    tennis: [
      ['tA', 'Victoire joueur 1', 'tennisA', false, 'modèle'], ['tB', 'Victoire joueur 2', 'tennisB', false, 'modèle'],
      ['tO', 'Plus de X jeux', 'tOver', true, 'modèle'], ['tU', 'Moins de X jeux', 'tUnder', true, 'modèle'],
      ['spA', 'Handicap jeux joueur 1 (ex. -3.5)', 'spread', true, 'modèle', null, 'A'], ['spB', 'Handicap jeux joueur 2 (ex. +3.5)', 'spread', true, 'modèle', null, 'B'],
    ],
  };
  MARKETS.basket = MARKETS.nba;
  let lastResult = null;

  function render() {
    const A = S.lastAnalysis();
    const evs = (A?.events || []).filter((e) => e.spec && e.t > Date.now()).sort((a, b) => a.t - b.t);
    if (!evs.length) return `<h2>Vérifier une cote</h2><section class="card empty"><p>Lancez d’abord une analyse depuis le <a href="#dashboard">tableau de bord</a> : le vérificateur utilise les modèles calculés pour chaque match à venir.</p></section>`;
    const cur = lastResult?.evId && evs.find((e) => e.id === lastResult.evId) ? lastResult.evId : evs[0].id;
    const ev = evs.find((e) => e.id === cur);
    return `<h2>Vérifier une cote</h2>
      <p class="muted">Pour une cote boostée Winamax ou un marché que l’analyse automatique ne couvre pas : choisissez le match et le pari, saisissez la cote affichée sur Winamax.</p>
      <form id="chk" class="card cfg">
        <label>Match <select id="k-ev">${evs.map((e) => `<option value="${esc(e.id)}" ${e.id === cur ? 'selected' : ''}>${esc(dt(e.t))} · ${esc(e.home)} – ${esc(e.away)} (${esc(e.comp)})</option>`).join('')}</select></label>
        <div class="g3">
          <label>Pari <select id="k-mk">${MARKETS[ev.sport].map((m) => `<option value="${m[0]}" ${lastResult?.mk === m[0] ? 'selected' : ''}>${esc(m[1].replace('joueur 1', ev.home).replace('joueur 2', ev.away))}</option>`).join('')}</select></label>
          <label>Ligne (si demandée) <input id="k-line" type="number" step="any" inputmode="decimal" placeholder="ex. 2.5" value="${lastResult?.line ?? ''}"></label>
          <label>Cote Winamax <input id="k-odds" type="number" step="any" min="1.01" inputmode="decimal" placeholder="ex. 2.10" value="${lastResult?.odds ?? ''}" required></label>
        </div>
        <label class="chk"><input type="checkbox" id="k-boost" ${lastResult?.boost ? 'checked' : ''}> C’est une cote boostée (mise souvent plafonnée par Winamax)</label>
        <div class="row"><button class="btn-main sm" type="submit">Calculer</button><span id="k-wait" class="muted" hidden>Simulation en cours…</span></div>
      </form>
      <div id="k-out">${lastResult?.html || ''}</div>`;
  }

  async function compute(ev, mkId, line, odds, boost) {
    const C = P.cfg();
    const m = MARKETS[ev.sport].find((x) => x[0] === mkId);
    const [, label, type, needLine, validation, fixedPoint, extra] = m;
    if (needLine && !Number.isFinite(line) && fixedPoint == null) throw new Error('Ce pari demande une ligne (par exemple 2.5).');
    const point = fixedPoint != null ? fixedPoint : line;
    let pWin, pPush = 0, ci = null, n = 0, source;
    if (type === 'corners' || type === 'cards') {
      const L = await D.localData();
      const rows = L.football?.leagues?.[ev.sportKey];
      if (!rows) throw new Error('Données corners/cartons indisponibles pour cette compétition (seulement les championnats suivis, en version en ligne).');
      const fit = SP.fitCounts(rows.map(SP.fdRow), type);
      if (!fit) throw new Error('Pas assez de données pour ce modèle.');
      const mh = D.bestMatch(ev.home, fit.teams), ma = D.bestMatch(ev.away, fit.teams);
      if (!mh.name || !ma.name) throw new Error('Équipe(s) introuvable(s) dans les données football-data.');
      const l = SP.dcLambdas(fit, mh.name, ma.name), mu = l.lh + l.la;
      const over = SP.nbOver(mu, fit.phi, point);
      const exact = Number.isInteger(point) ? SP.nbPmf(point, mu, fit.phi) : 0;
      pPush = exact;
      pWin = extra === 'over' ? over : 1 - over - exact;
      source = `${type === 'corners' ? 'Corners' : 'Cartons jaunes'} : modèle attaque/défense par équipe sur ${fit.n} matchs football-data, moyenne attendue ${mu.toFixed(2)} (${mh.name} ${l.lh.toFixed(2)} / ${ma.name} ${l.la.toFixed(2)}), dispersion ${fit.phi.toFixed(2)}`;
    } else {
      const sel = SP.normalizeSel({ type, point, side: extra });
      const res = await P.runSims([{ spec: { ...ev.spec, seed: (Date.now() >>> 0), minN: 200000, maxN: 600000, tol: 0.002 }, sel }]);
      const r = res[0]; if (!r || r.error) throw new Error('Simulation impossible : ' + (r?.error || 'erreur'));
      const e = SP.evalFromSim(r, sel, odds);
      pWin = e.pWin; pPush = e.pPush; ci = e.ci95; n = r.n;
      source = `${n.toLocaleString('fr-FR')} simulations Monte-Carlo à partir des paramètres de l’analyse (${ev.wSource ? 'poids marché : ' + ev.wSource : 'mélange marché/modèles'})`;
    }
    if (C.platt && validation === 'backtest') pWin = SP.applyPlatt(C.platt, pWin);
    const ev_ = pWin * odds + pPush - 1;
    const need = validation === 'backtest' ? C.minEV : Math.max(0.05, 2 * C.minEV);
    const minOdds = Math.ceil(((1 + need - pPush) / Math.max(1e-6, pWin)) * 100) / 100;
    const k = Math.max(0, ev_ / (odds - 1));
    const frac = Math.min(C.maxStakePct, C.kellyFrac * k);
    const B = (() => { try { return SPMyBets.stats().bankroll; } catch { return C.bankroll; } })();
    const stake = Math.round(B * frac * 100) / 100;
    const age = (Date.now() - (S.lastAnalysis()?.finishedAt || 0)) / 3600e3;
    const ok = ev_ >= need && odds >= C.minOdds;
    const warn = [];
    if (age > 6) warn.push(`L’analyse date de ${Math.round(age)} h : relancez-la pour intégrer les dernières cotes et blessures.`);
    if (validation === 'modèle') warn.push('Marché calculé par le modèle mais jamais comparé à des cotes réelles : exigence d’EV doublée (' + (need * 100).toFixed(0) + ' %).');
    if (boost) warn.push('Cote boostée : vérifiez la mise maximale autorisée par Winamax.');
    if (odds < C.minOdds) warn.push(`Cote inférieure au minimum (${C.minOdds}).`);
    const html = `<section class="card ${ok ? 'pick big' : ''}">
      <h3>${ok ? 'VALUE : ce pari est intéressant' : 'PAS DE VALUE : ne pariez pas'}</h3>
      <p><b>${esc(ev.home)} – ${esc(ev.away)}</b> · ${esc(label.replace('joueur 1', ev.home).replace('joueur 2', ev.away))}${needLine && fixedPoint == null ? ` · ligne ${point}` : ''} @ <b>${odds.toFixed(2)}</b>${boost ? ' (boostée)' : ''}</p>
      <div class="kpis">
        <div><small>Probabilité estimée</small><b>${pct(pWin)}</b><span>${ci != null ? 'IC95 ±' + pct(ci, 2) : ''}${pPush ? ' · remb. ' + pct(pPush) : ''}</span></div>
        <div><small>Cote juste</small><b>${((1 - pPush) / Math.max(1e-6, pWin)).toFixed(2)}</b><span>sans marge</span></div>
        <div><small>EV</small><b class="${ev_ > 0 ? 'pos' : 'neg'}">${sgn(ev_)}</b><span>seuil ${(need * 100).toFixed(0)} %</span></div>
        <div><small>Cote minimale</small><b>${minOdds.toFixed(2)}</b><span>pour valider</span></div>
        <div><small>Mise indicative</small><b>${ok ? stake.toFixed(2) + ' €' : '0 €'}</b><span>${ok ? (frac * 100).toFixed(1) + ' % de ' + B.toFixed(2) + ' €' : 'aucune'}</span></div>
      </div>
      ${warn.length ? `<ul class="muted">${warn.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
      <p class="muted">Source : ${esc(source)}.</p></section>`;
    return { html, evId: ev.id, mk: mkId, line, odds, boost };
  }

  function bind(rerender) {
    const f = document.getElementById('chk'); if (!f) return;
    document.getElementById('k-ev').addEventListener('change', (e) => { lastResult = { evId: e.target.value }; rerender(); });
    f.addEventListener('submit', async (e) => {
      e.preventDefault();
      const A = S.lastAnalysis();
      const ev = A.events.find((x) => x.id === document.getElementById('k-ev').value);
      const odds = parseFloat(String(document.getElementById('k-odds').value).replace(',', '.'));
      const lineRaw = String(document.getElementById('k-line').value).replace(',', '.');
      const line = lineRaw === '' ? NaN : parseFloat(lineRaw);
      if (!(odds > 1)) return;
      document.getElementById('k-wait').hidden = false;
      try {
        lastResult = await compute(ev, document.getElementById('k-mk').value, line, odds, document.getElementById('k-boost').checked);
      } catch (err) {
        lastResult = { evId: ev.id, html: `<section class="card notice">${esc(err.message || err)}</section>` };
      }
      rerender();
    });
  }
  return { render, bind };
})();

<script>
/* SportPredict AI — « Mes paris » : paris réellement joués, bankroll et tableau de bord dans le temps. */
const SPMyBets = (() => {
  const D = SPData, P = SPPipeline, S = SPStore;
  const KEY = 'sp:mybets', BKEY = 'sp:bank';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const eur = (x) => (x == null || isNaN(x) ? '—' : (x >= 0 ? '' : '−') + Math.abs(x).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €');
  const eurS = (x) => (x == null || isNaN(x) ? '—' : (x > 0 ? '+' : '') + eur(x));
  const pct = (x, d = 1) => (x == null || isNaN(x) ? '—' : (x * 100).toFixed(d) + ' %');
  const sgn = (x) => (x == null || isNaN(x) ? '—' : (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + ' %');
  const TZ = 'Europe/Paris';
  const dt = (t) => new Date(t).toLocaleString('fr-FR', { timeZone: TZ, day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  const dayKey = (t) => new Date(t).toLocaleDateString('fr-CA', { timeZone: TZ }); // AAAA-MM-JJ
  const SPORT = { football: 'Football', tennis: 'Tennis', nba: 'NBA', basket: 'Basket', autre: 'Autre' };
  const SRC = { daily: 'Pronostic du jour', best: 'Meilleur pari', value: 'Value', prono: 'Pronostic', check: 'Vérificateur', manuel: 'Pari perso' };

  const bets = () => D.LS.get(KEY, []);
  const saveBets = (b) => D.LS.set(KEY, b);
  const bank = () => D.LS.get(BKEY, null); // { start, since, moves: [{t, amount, note}] }
  let period = 'tout', draft = null;

  // ISO semaine « 2026-S45 »
  function weekKey(t) {
    const d = new Date(new Date(t).toLocaleDateString('fr-CA', { timeZone: TZ }) + 'T12:00:00Z');
    const day = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - day + 3);
    const y = d.getUTCFullYear(), first = new Date(Date.UTC(y, 0, 4));
    const w = 1 + Math.round(((d - first) / 86400e3 - 3 + ((first.getUTCDay() + 6) % 7)) / 7);
    return `${y}-S${String(w).padStart(2, '0')}`;
  }

  // ------------------------------------------------------------------ ajout depuis un pronostic
  function openAdd(pre) {
    const C = P.cfg(), b = bank();
    const cur = b ? stats().bankroll : C.bankroll;
    const sugg = pre.suggested != null ? pre.suggested : Math.round(cur * 0.01 * 100) / 100;
    draft = pre;
    const dlg = document.getElementById('dlg');
    document.getElementById('dlgc').innerHTML = `<header><h3>J’ai parié</h3><button id="dlgx" class="x" aria-label="Fermer">×</button></header>
      <form id="addbet" class="cfg">
        <p><b>${esc(pre.match || '')}</b>${pre.t ? ` · ${dt(pre.t)}` : ''}<br>${esc(pre.label || '')}</p>
        ${pre.manual ? `<div class="g3">
          <label>Match / description <input id="b-match" required placeholder="ex. PSG – Lyon" value="${esc(pre.match || '')}"></label>
          <label>Pari <input id="b-label" required placeholder="ex. PSG gagne" value="${esc(pre.label || '')}"></label>
          <label>Sport <select id="b-sport">${Object.entries(SPORT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label>
          <label>Date du match <input id="b-date" type="datetime-local" value="${new Date(Date.now() - new Date().getTimezoneOffset() * 60e3).toISOString().slice(0, 16)}"></label></div>` : ''}
        <div class="g3">
          <label>Cote obtenue <input id="b-odds" type="number" step="any" min="1.01" inputmode="decimal" required value="${pre.odds ?? ''}"></label>
          <label>Mise (€) <input id="b-stake" type="number" step="any" min="0.1" inputmode="decimal" required value="${sugg}"></label>
          <label>Bookmaker <input id="b-book" value="${esc(pre.book || 'Winamax')}"></label>
        </div>
        <p class="muted">${pre.suggested != null ? `Mise conseillée par le moteur : ${eur(pre.suggested)}.` : 'Pas de value sur ce pari : restez sur une petite mise (1 % de la bankroll au maximum).'}</p>
        <div class="row"><button class="btn-main sm" type="submit">Enregistrer le pari</button></div>
      </form>`;
    dlg.hidden = false;
    document.getElementById('dlgx').onclick = () => { dlg.hidden = true; };
    document.getElementById('addbet').addEventListener('submit', (e) => {
      e.preventDefault();
      const g = (id) => document.getElementById(id);
      const odds = parseFloat(String(g('b-odds').value).replace(',', '.')), stake = parseFloat(String(g('b-stake').value).replace(',', '.'));
      if (!(odds > 1) || !(stake > 0)) return;
      const bet = {
        id: 'B' + Date.now() + Math.floor(Math.random() * 1000), createdAt: Date.now(), source: draft.source || 'manuel',
        eventId: draft.eventId || null, sport: draft.manual ? g('b-sport').value : draft.sport, sportKey: draft.sportKey || null, comp: draft.comp || '',
        match: draft.manual ? g('b-match').value.trim() : draft.match, home: draft.home || null, away: draft.away || null,
        t: draft.manual ? Date.parse(g('b-date').value) || Date.now() : draft.t, label: draft.manual ? g('b-label').value.trim() : draft.label,
        type: draft.type || null, point: draft.point ?? null, market: draft.market || null,
        odds, stake, book: g('b-book').value.trim() || 'Winamax', pApp: draft.p ?? null, oddsApp: draft.odds ?? null, value: !!draft.value,
        status: 'en attente', profit: null,
      };
      const all = bets(); all.push(bet); saveBets(all);
      dlg.hidden = true;
      if (window.SPToast) window.SPToast('Pari enregistré dans « Mes paris »');
      if (window.SPRoute) window.SPRoute();
    });
  }

  // ------------------------------------------------------------------ règlement
  function settleOne(b, status, score, source) {
    const win = status === 'gagné' ? 1 : status === 'demi-gagné' ? 0.5 : 0;
    const push = status === 'remboursé' || status === 'annulé' ? 1 : status === 'demi-gagné' || status === 'demi-perdu' ? 0.5 : 0;
    b.status = status;
    b.profit = Math.round((b.stake * win * (b.odds - 1) - b.stake * (1 - win - push)) * 100) / 100;
    b.score = score || null; b.settledAt = Date.now(); b.settleSource = source;
  }
  async function autoSettle() {
    const all = bets();
    const pend = all.filter((b) => b.status === 'en attente' && b.type && b.home && b.t < Date.now() - 2.5 * 3600e3 && (b.sport === 'football' || b.sport === 'nba'));
    let n = 0;
    for (const b of pend) {
      const lg = b.sport === 'nba' ? ['basketball', 'nba'] : ['soccer', D.FOOTBALL[b.sportKey]?.espn];
      if (!lg[1]) continue;
      const sb = await D.espnScoreboard(lg[0], lg[1], b.t - 86400e3, b.t + 86400e3);
      if (!sb.ok) continue;
      const ev = sb.events.find((x) => x.completed && D.sim(x.h, b.home) >= 0.5 && D.sim(x.a, b.away) >= 0.5 && Math.abs(x.t - b.t) < 36 * 3600e3);
      if (!ev) continue;
      const r = S.settle({ sport: b.sport, type: b.type, point: b.point, odds: b.odds }, ev.hs, ev.as);
      if (!r) continue;
      settleOne(b, r.status, `${ev.hs}-${ev.as}`, 'ESPN (automatique)'); n++;
    }
    if (n) saveBets(all);
    return n;
  }

  // ------------------------------------------------------------------ statistiques
  function stats(filterFn) {
    const b = bank();
    const all = bets().slice().sort((x, y) => x.t - y.t);
    const list = filterFn ? all.filter(filterFn) : all;
    const done = list.filter((x) => x.status !== 'en attente');
    const pending = list.filter((x) => x.status === 'en attente');
    const staked = done.reduce((s, x) => s + (x.status === 'annulé' ? 0 : x.stake), 0);
    const profit = done.reduce((s, x) => s + (x.profit || 0), 0);
    const wins = done.filter((x) => x.profit > 0).length, losses = done.filter((x) => x.profit < 0).length;
    const moves = (b?.moves || []).reduce((s, m) => s + m.amount, 0);
    const allProfit = all.filter((x) => x.status !== 'en attente').reduce((s, x) => s + (x.profit || 0), 0);
    const bankroll = (b?.start ?? P.cfg().bankroll) + moves + allProfit;
    const atRisk = all.filter((x) => x.status === 'en attente').reduce((s, x) => s + x.stake, 0);
    // courbe de bankroll jour par jour, perte maximale depuis un sommet, séries
    const days = new Map();
    for (const x of all.filter((y) => y.status !== 'en attente')) { const k = dayKey(x.settledAt && x.t > Date.now() ? x.settledAt : x.t); days.set(k, (days.get(k) || 0) + x.profit); }
    for (const m of b?.moves || []) { const k = dayKey(m.t); days.set(k, (days.get(k) || 0) + m.amount); }
    let level = b?.start ?? P.cfg().bankroll, peak = level, maxDD = 0;
    const curve = [...days.entries()].sort().map(([k, v]) => { level += v; peak = Math.max(peak, level); maxDD = Math.max(maxDD, (peak - level) / peak); return { k, v: level }; });
    let streak = 0, streakType = null;
    for (const x of done.slice().reverse()) { const t = x.profit > 0 ? 'V' : x.profit < 0 ? 'D' : null; if (!t) continue; if (!streakType) streakType = t; if (t !== streakType) break; streak++; }
    const group = (f) => {
      const m = {};
      for (const x of done) { const k = f(x); m[k] = m[k] || { n: 0, wins: 0, staked: 0, profit: 0, odds: 0 }; m[k].n++; m[k].wins += x.profit > 0 ? 1 : 0; m[k].staked += x.status === 'annulé' ? 0 : x.stake; m[k].profit += x.profit; m[k].odds += x.odds; }
      return m;
    };
    return {
      list, done, pending, staked, profit, wins, losses, bankroll, atRisk, maxDD, curve, streak, streakType,
      roi: staked ? profit / staked : null, hit: done.length ? wins / done.length : null,
      avgOdds: done.length ? done.reduce((s, x) => s + x.odds, 0) / done.length : null,
      avgStake: list.length ? list.reduce((s, x) => s + x.stake, 0) / list.length : null,
      expected: done.filter((x) => x.pApp != null).reduce((s, x) => s + x.stake * (x.pApp * x.odds - 1), 0),
      byWeek: group((x) => weekKey(x.t)), byDay: group((x) => dayKey(x.t)), bySport: group((x) => SPORT[x.sport] || x.sport),
      bySource: group((x) => SRC[x.source] || x.source), byMarket: group((x) => x.label?.match(/corner/i) ? 'Corners' : x.label?.match(/carton/i) ? 'Cartons' : ({ h2h: 'Vainqueur', totals: 'Total', spreads: 'Handicap' }[x.market] || 'Autre')),
      byValue: group((x) => (x.value ? 'Avec value' : 'Sans value')),
    };
  }

  // ------------------------------------------------------------------ rendu
  function lineSVG(curve, start) {
    if (curve.length < 2) return '<p class="muted">La courbe apparaît après deux jours de paris réglés.</p>';
    const W = 640, H = 220, pad = 48;
    const ys = curve.map((p) => p.v).concat(start), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
    const X = (i) => pad + i / (curve.length - 1) * (W - pad - 12), Y = (v) => 12 + (hi - v) / span * (H - 44);
    const d = curve.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
    const last = curve[curve.length - 1];
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Évolution de la bankroll">
      <line x1="${pad}" x2="${W - 12}" y1="${Y(start)}" y2="${Y(start)}" class="axis dash"/>
      <text x="4" y="${Y(hi) + 4}" class="lbl">${Math.round(hi)} €</text><text x="4" y="${Y(lo) + 4}" class="lbl">${Math.round(lo)} €</text><text x="4" y="${Y(start) - 4}" class="lbl">départ</text>
      <path d="${d} L${X(curve.length - 1)},${H - 32} L${X(0)},${H - 32} Z" class="area"/><path d="${d}" class="line"/>
      <circle cx="${X(curve.length - 1)}" cy="${Y(last.v)}" r="4" class="endpt"/>
      <text x="${X(curve.length - 1) - 6}" y="${Y(last.v) - 9}" text-anchor="end" class="lbl b">${eur(last.v)}</text>
      <text x="${pad}" y="${H - 10}" class="lbl">${curve[0].k}</text><text x="${W - 12}" y="${H - 10}" text-anchor="end" class="lbl">${last.k}</text></svg>`;
  }
  function barsSVG(byWeek) {
    const ks = Object.keys(byWeek).sort().slice(-12);
    if (!ks.length) return '<p class="muted">Pas encore de semaine terminée.</p>';
    const W = 640, H = 200, pad = 40, vals = ks.map((k) => byWeek[k].profit), m = Math.max(1, ...vals.map(Math.abs));
    const bw = (W - pad - 12) / ks.length, zero = H / 2;
    return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Profit par semaine">
      <line x1="${pad}" x2="${W - 12}" y1="${zero}" y2="${zero}" class="axis"/>
      <text x="4" y="16" class="lbl">+${m.toFixed(0)} €</text><text x="4" y="${H - 22}" class="lbl">−${m.toFixed(0)} €</text>
      ${ks.map((k, i) => { const v = byWeek[k].profit, h = Math.abs(v) / m * (zero - 24); return `<rect x="${pad + i * bw + bw * 0.15}" y="${v >= 0 ? zero - h : zero}" width="${bw * 0.7}" height="${Math.max(1, h)}" rx="3" class="${v >= 0 ? 'barp' : 'barn'}"><title>${k} : ${eurS(v)} (${byWeek[k].n} paris)</title></rect><text x="${pad + i * bw + bw / 2}" y="${H - 4}" text-anchor="middle" class="lbl">${k.slice(5)}</text>`; }).join('')}
    </svg>`;
  }
  function table(obj, label, sortKeys) {
    const ks = sortKeys ? Object.keys(obj).sort().reverse() : Object.keys(obj).sort((a, b) => obj[b].n - obj[a].n);
    if (!ks.length) return '<p class="muted">—</p>';
    return `<div class="tw"><table class="t"><thead><tr><th>${label}</th><th>Paris</th><th>Réussite</th><th>Misé</th><th>Profit</th><th>ROI</th><th>Cote moy.</th></tr></thead><tbody>
      ${ks.map((k) => { const v = obj[k]; return `<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${pct(v.wins / v.n, 0)}</td><td class="n">${eur(v.staked)}</td><td class="n ${v.profit >= 0 ? 'pos' : 'neg'}">${eurS(v.profit)}</td><td class="n">${v.staked ? sgn(v.profit / v.staked) : '—'}</td><td class="n">${(v.odds / v.n).toFixed(2)}</td></tr>`; }).join('')}
    </tbody></table></div>`;
  }

  function render() {
    const b = bank();
    const now = Date.now();
    const f = period === 'jour' ? (x) => dayKey(x.t) === dayKey(now) : period === 'semaine' ? (x) => weekKey(x.t) === weekKey(now) : period === 'mois' ? (x) => dayKey(x.t).slice(0, 7) === dayKey(now).slice(0, 7) : null;
    const st = stats(f), all = stats();
    const k = (l, v, s, cls = '') => `<div class="kpi"><small>${l}</small><b class="${cls}">${v}</b>${s ? `<span>${s}</span>` : ''}</div>`;
    const setup = !b ? `<section class="card notice"><h3>Votre bankroll de départ</h3><p>Indiquez la somme que vous consacrez aux paris. Elle sert de base au suivi et aux mises conseillées.</p>
      <form id="bankf" class="row"><input id="bk-start" type="number" step="any" min="1" inputmode="decimal" placeholder="ex. 100" required aria-label="Bankroll de départ"><button class="btn-sec" type="submit">Commencer le suivi</button></form></section>` : '';
    const start = b?.start ?? P.cfg().bankroll;
    return `<h2>Mes paris</h2>
      ${setup}
      <div class="row"><div class="seg">${[['jour', 'Aujourd’hui'], ['semaine', 'Cette semaine'], ['mois', 'Ce mois'], ['tout', 'Depuis le début']].map(([v, l]) => `<button data-per="${v}" class="${period === v ? 'on' : ''}">${l}</button>`).join('')}</div>
        <button id="addmanual" class="btn-sec">+ Ajouter un pari</button><button id="settlemine" class="btn-sec">Mettre à jour les résultats</button></div>
      <div class="kpirow">
        ${k('Bankroll actuelle', eur(all.bankroll), `mise à jour à chaque pari réglé · départ ${eur(start)}${b?.since ? ' le ' + new Date(b.since).toLocaleDateString('fr-FR') : ''}`, all.bankroll >= start ? 'pos' : 'neg')}
        ${k('Profit', eurS(st.profit), `${st.done.length} pari(s) réglé(s)`, st.profit >= 0 ? 'pos' : 'neg')}
        ${k('ROI', sgn(st.roi), 'profit / mises')}
        ${k('Réussite', pct(st.hit, 0), `${st.wins} gagnés · ${st.losses} perdus`)}
        ${k('En jeu', eur(all.atRisk), `${all.pending.length} pari(s) en attente`)}
        ${k('Cote moyenne', st.avgOdds ? st.avgOdds.toFixed(2) : '—', `mise moyenne ${eur(st.avgStake)}`)}
        ${k('Série en cours', all.streak ? `${all.streak} ${all.streakType === 'V' ? 'gagné' : 'perdu'}${all.streak > 1 ? 's' : ''}` : '—')}
        ${k('Perte max. depuis un sommet', pct(all.maxDD, 0), 'drawdown')}
        ${k('Profit attendu', eurS(st.expected), 'selon les probabilités du moteur')}
      </div>
      ${all.atRisk > 0.15 * all.bankroll ? `<p class="notice">Vous avez ${eur(all.atRisk)} en jeu, soit plus de 15 % de votre bankroll : c’est risqué.</p>` : ''}
      ${all.streakType === 'D' && all.streak >= 4 ? `<p class="notice">${all.streak} paris perdus d’affilée : c’est normal statistiquement de temps en temps. N’augmentez pas vos mises pour « vous refaire ».</p>` : ''}
      <div class="grid2">
        <section class="card"><h3>Évolution de la bankroll</h3>${lineSVG(all.curve, start)}</section>
        <section class="card"><h3>Profit par semaine</h3>${barsSVG(all.byWeek)}</section>
      </div>
      <section class="card"><h3>Semaine par semaine</h3>${table(st.byWeek, 'Semaine', true)}</section>
      <section class="card"><h3>Jour par jour</h3>${table(st.byDay, 'Jour', true)}</section>
      <div class="grid2">
        <section class="card"><h3>Par sport</h3>${table(st.bySport, 'Sport')}</section>
        <section class="card"><h3>Par type de pari</h3>${table(st.bySource, 'Origine')}</section>
        <section class="card"><h3>Par marché</h3>${table(st.byMarket, 'Marché')}</section>
        <section class="card"><h3>Avec ou sans value</h3>${table(st.byValue, 'Value')}<p class="muted">Sur la durée, seuls les paris « avec value » devraient être rentables.</p></section>
      </div>
      <section class="card"><h3>Tous mes paris</h3><div class="tw"><table class="t hist"><thead><tr><th>Match</th><th>Pari</th><th>Cote</th><th>Mise</th><th>Origine</th><th>Résultat</th><th>Profit</th><th></th></tr></thead><tbody>
        ${st.list.slice().reverse().map((x) => `<tr><td>${esc(x.match)}<br><small class="muted">${dt(x.t)} · ${esc(SPORT[x.sport] || '')}</small></td><td>${esc(x.label)}</td><td class="n">${x.odds.toFixed(2)}</td><td class="n">${eur(x.stake)}</td><td>${esc(SRC[x.source] || x.source)}${x.value ? ' <span class="tag t-ok">value</span>' : ''}</td>
          <td>${x.status === 'en attente' ? `<span class="manual" data-bid="${esc(x.id)}"><button data-r="gagné" title="Gagné">G</button><button data-r="perdu" title="Perdu">P</button><button data-r="remboursé" title="Remboursé">R</button></span>${x.type ? '<br><small class="muted">réglage auto après le match</small>' : ''}` : `<span class="tag t-${x.profit > 0 ? 'ok' : x.profit < 0 ? 'bad' : 'na'}">${esc(x.status)}</span> <small class="muted">${esc(x.score || '')}</small>`}</td>
          <td class="n ${x.profit > 0 ? 'pos' : x.profit < 0 ? 'neg' : ''}">${x.profit != null ? eurS(x.profit) : '—'}</td><td><button class="linkbtn" data-del="${esc(x.id)}" title="Supprimer">supprimer</button></td></tr>`).join('') || '<tr><td colspan="8" class="muted">Aucun pari. Appuyez sur « J’ai parié » sous un pronostic, ou sur « + Ajouter un pari ».</td></tr>'}
      </tbody></table></div></section>
      ${b ? `<section class="card"><h3>Dépôts et retraits</h3><form id="movef" class="row"><input id="mv-amt" type="number" step="any" inputmode="decimal" placeholder="+50 ou −20" required aria-label="Montant"><input id="mv-note" placeholder="note (facultatif)" aria-label="Note"><button class="btn-sec" type="submit">Ajouter</button></form>
        <ul class="muted">${(b.moves || []).map((m) => `<li>${new Date(m.t).toLocaleDateString('fr-FR')} : ${eurS(m.amount)} ${esc(m.note || '')}</li>`).join('') || '<li>Aucun mouvement.</li>'}</ul>
        <p><button id="resetbank" class="linkbtn">Changer la bankroll de départ</button></p></section>` : ''}`;
  }

  function bind(rerender) {
    const $ = (q) => document.querySelector(q);
    $('#bankf')?.addEventListener('submit', (e) => { e.preventDefault(); const v = parseFloat($('#bk-start').value); if (!(v > 0)) return; D.LS.set(BKEY, { start: v, since: Date.now(), moves: [] }); const C = P.cfg(); C.bankroll = v; P.saveCfg(C); rerender(); });
    document.querySelectorAll('[data-per]').forEach((x) => x.addEventListener('click', () => { period = x.dataset.per; rerender(); }));
    $('#addmanual')?.addEventListener('click', () => openAdd({ manual: true, source: 'manuel' }));
    $('#settlemine')?.addEventListener('click', async () => { const n = await autoSettle(); if (window.SPToast) window.SPToast(`${n} résultat(s) mis à jour`); rerender(); });
    document.querySelectorAll('.manual[data-bid] button').forEach((btn) => btn.addEventListener('click', () => {
      const all = bets(), x = all.find((y) => y.id === btn.parentElement.dataset.bid); if (!x) return;
      settleOne(x, btn.dataset.r, null, 'saisie manuelle'); saveBets(all); rerender();
    }));
    document.querySelectorAll('[data-del]').forEach((btn) => btn.addEventListener('click', () => {
      if (!window.confirm('Supprimer ce pari du suivi ?')) return;
      saveBets(bets().filter((y) => y.id !== btn.dataset.del)); rerender();
    }));
    $('#movef')?.addEventListener('submit', (e) => {
      e.preventDefault(); const v = parseFloat(String($('#mv-amt').value).replace(',', '.')); if (!v) return;
      const b = bank(); b.moves = [...(b.moves || []), { t: Date.now(), amount: v, note: $('#mv-note').value.trim() }]; D.LS.set(BKEY, b); rerender();
    });
    $('#resetbank')?.addEventListener('click', () => {
      const b = bank(); const v = parseFloat(window.prompt('Nouvelle bankroll de départ (€) :', b?.start ?? ''));
      if (v > 0) { D.LS.set(BKEY, { ...b, start: v }); rerender(); }
    });
  }
  return { render, bind, openAdd, autoSettle, stats, bets };
})();

</script>
<script>
/* SportPredict AI — interface. */
(() => {
  const D = SPData, P = SPPipeline, S = SPStore, SP = P.SP;
  const $ = (q, el = document) => el.querySelector(q);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pct = (x, d = 1) => (x == null || isNaN(x) ? '—' : (x * 100).toFixed(d) + ' %');
  const sgn = (x, d = 1) => (x == null || isNaN(x) ? '—' : (x >= 0 ? '+' : '') + (x * 100).toFixed(d) + ' %');
  const num = (x, d = 2) => (x == null || isNaN(x) ? '—' : Number(x).toFixed(d));
  const int = (n) => (n == null ? '—' : new Intl.NumberFormat('fr-FR').format(n));
  const TZ = 'Europe/Paris';
  const dt = (t) => new Date(t).toLocaleString('fr-FR', { timeZone: TZ, weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  const hm = (t) => new Date(t).toLocaleTimeString('fr-FR', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
  const ago = (t) => { const m = Math.round((Date.now() - t) / 60e3); return m < 1 ? 'à l’instant' : m < 60 ? `il y a ${m} min` : m < 1440 ? `il y a ${Math.round(m / 60)} h` : `il y a ${Math.round(m / 1440)} j`; };
  const SPORT = { football: 'Football', tennis: 'Tennis', nba: 'NBA', basket: 'Basket' };
  const MKT = { h2h: 'Vainqueur', totals: 'Total', spreads: 'Handicap' };

  const STEPS = ['Récupération des matchs', 'Collecte des statistiques', 'Analyse des blessures', 'Vérification des compositions', 'Analyse des actualités', 'Comparaison des cotes', 'Calcul des modèles', 'Simulations Monte-Carlo', 'Classement des opportunités', 'Validation finale'];
  let running = false;
  const state = { steps: STEPS.map((n) => ({ name: n, st: 'attente', note: '', frac: 0 })) };

  // ------------------------------------------------------------ progression réelle
  const stepsUI = {
    start(i) { state.steps[i].st = 'en cours'; state.steps[i].frac = 0; renderProgress(); },
    progress(i, d, n, note) { state.steps[i].frac = n ? d / n : 0; state.steps[i].note = note ? `${note} (${d}/${n})` : `${d}/${n}`; renderProgress(); },
    done(i, note, warn) { state.steps[i].st = warn ? 'avertissement' : 'terminé'; state.steps[i].frac = 1; state.steps[i].note = note || ''; renderProgress(); },
    fail(i, msg) { state.steps[i].st = 'erreur'; state.steps[i].note = msg; for (let k = i + 1; k < STEPS.length; k++) state.steps[k].st = 'non exécutée'; renderProgress(); },
  };
  function renderProgress() {
    const el = $('#progress'); if (!el) return;
    const done = state.steps.reduce((s, x) => s + (['terminé', 'avertissement', 'erreur', 'non exécutée'].includes(x.st) ? 1 : x.st === 'en cours' ? x.frac : 0), 0);
    el.hidden = false;
    $('#pbar').style.width = (done / STEPS.length * 100).toFixed(1) + '%';
    $('#ptext').textContent = `${Math.round(done / STEPS.length * 100)} % — ${state.steps.filter((x) => x.st === 'terminé' || x.st === 'avertissement').length}/10 étapes terminées`;
    $('#steps').innerHTML = state.steps.map((s, i) => `<li class="step s-${s.st.replace(/\s/g, '-').normalize('NFD').replace(/[̀-ͯ]/g, '')}"><span class="dot"></span><span class="sn">${i + 1}. ${esc(s.name)}</span><span class="sst">${esc(s.st)}</span>${s.note ? `<span class="snote">${esc(s.note)}</span>` : ''}</li>`).join('');
  }

  async function launch(opts = {}) {
    if (running) return;
    running = true;
    state.steps.forEach((s) => { s.st = 'attente'; s.note = ''; s.frac = 0; });
    document.body.classList.add('busy');
    renderProgress();
    try {
      const A = await P.run({ steps: stepsUI }, opts);
      afterRun(A, opts);
    } catch (e) {
      console.error(e);
      toast('Analyse interrompue : ' + (e.message || e), 'bad');
    } finally {
      running = false;
      document.body.classList.remove('busy');
      route();
    }
  }
  function afterRun(A, opts) {
    // CLV : dernière cote juste relevée avant le début pour chaque pronostic en attente
    for (const p of S.picks()) {
      if (S.results()[p.pid] || p.t < Date.now()) continue;
      const E = A.events.find((e) => e.id === p.eventId); if (!E) continue;
      const s = E.sels.find((x) => x.id === p.selId); if (!s) continue;
      S.recordCLV(p.pid, { odds: s.best, fair: s.fair, book: s.book });
    }
    if (opts.parentId) {
      const prev = S.analyses().find((a) => a.id === opts.parentId);
      const tracked = prev ? [prev.best, ...prev.values, ...prev.watch].filter(Boolean) : [];
      A.recheck = tracked.map((p) => {
        const E = A.events.find((e) => e.id === p.eventId);
        const s = E?.sels.find((x) => x.id === p.selId);
        if (!E || !s) return { ...p, verdict: 'événement ou marché indisponible', status: 'bad' };
        const keep = (A.best && A.best.selId === p.selId && A.best.eventId === p.eventId) || A.values.some((v) => v.selId === p.selId && v.eventId === p.eventId);
        return { match: p.match, label: p.label, oldOdds: p.odds, newOdds: s.best, oldP: p.p, newP: s.p, oldEV: p.ev, newEV: s.ev, verdict: keep ? 'value confirmée' : (s.ev != null && s.ev > 0 ? 'value réduite : ne passe plus tous les critères' : 'value disparue — pari plus intéressant'), status: keep ? 'good' : 'bad' };
      });
      const list = S.analyses(); list[list.length - 1] = A; D.LS.set('sp:analyses', list);
    }
    if (P.cfg().notif && A.best && 'Notification' in window && Notification.permission === 'granted') {
      try { new Notification('SportPredict AI — pari validé', { body: `${A.best.match} · ${A.best.label} @ ${A.best.odds}` }); } catch { /* ignore */ }
    }
    if (A.storageOk === false) toast('Stockage du navigateur plein : analyse affichée mais non enregistrée. Faites Historique > Exporter puis videz le cache dans Réglages.', 'bad');
    location.hash = '#dashboard';
  }

  // ------------------------------------------------------------ composants
  function statusPills() {
    const st = D.apiStatus, C = P.cfg();
    const pill = (name, s, extra = '') => `<span class="pill ${s == null ? 'p-idle' : s.ok ? 'p-ok' : 'p-bad'}" title="${esc(s?.msg || 'pas encore appelé')}">${esc(name)}${extra}</span>`;
    return `<div class="pills">
      ${pill('The Odds API', C.oddsKey ? st['The Odds API'] : { ok: false, msg: 'clé manquante' }, st['The Odds API']?.remaining != null ? ` · ${st['The Odds API'].remaining} crédits` : '')}
      ${pill('ESPN', st.ESPN)}
      ${pill('Données quotidiennes', st['Données quotidiennes'], st['Données quotidiennes']?.at ? ` · ${ago(st['Données quotidiennes'].at)}` : '')}

    const news = (p.news || []).length ? `<details><summary>${p.news.length} article(s) relié(s)</summary><ul class="news">${p.news.map((n, i) => `<li><b>[S${i + 1}]</b> ${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a>` : esc(n.title)} <small>${esc(n.source)} · ${n.published ? dt(Date.parse(n.published)) : 'date inconnue'}</small></li>`).join('')}</ul></details>` : '<p class="muted">Aucun article ESPN relié à ce match.</p>';
    const info = (p.info || []).map((i) => i.kind === 'blessures'

      <header><div><span class="sport s-${p.sport}">${SPORT[p.sport]}</span> <span class="muted">${esc(p.comp)}</span>${p.day && p.day !== 'aujourd’hui' ? ` <span class="tag t-warn">${esc(p.day)}</span>` : ''}</div><div class="when">${dt(p.t)}</div></header>
      <h3>${esc(p.match)}</h3>

      <div class="kpis">
        <div><small>Cote</small><b class="odds">${num(p.odds)}</b><span>${esc(p.book)} · ${ago(p.oddsAt)}${p.bestAny && p.bestAny.price > p.odds ? ` · meilleure ailleurs ${num(p.bestAny.price)} (${esc(p.bestAny.title)})` : ''}</span></div>
        <div><small>Probabilité estimée</small><b>${pct(p.p)}</b><span>${p.ci != null ? `IC95 MC ±${pct(p.ci, 2)}` : ''}${p.pPush ? ` · remb. ${pct(p.pPush)}` : ''}</span></div>
        <div><small>Prob. implicite</small><b>${pct(p.pImplied)}</b><span>marché juste ${pct(p.pMkt)}</span></div>
        <div><small>Edge</small><b class="${p.edge > 0 ? 'pos' : 'neg'}">${sgn(p.edge)}</b><span>incertitude ±${pct(p.uncert)}</span></div>
        <div><small>EV</small><b class="${p.ev > 0 ? 'pos' : 'neg'}">${sgn(p.ev)}</b><span>par unité misée</span></div>
        <div><small>Score qualité</small><b>${p.score}/100</b><span>≠ probabilité</span></div>
        <div><small>Simulations</small><b>${int(p.sims)}</b><span>graine ${p.seed ?? '—'}</span></div>
      </div>
      ${p.cat !== 'watch' ? adviceBox(p) + betBtn({ source: p.cat === 'best' ? 'best' : 'value', eventId: p.eventId, sport: p.sport, sportKey: p.sportKey, comp: p.comp, match: p.match, home: p.home, away: p.away, t: p.t, label: p.label, type: p.type, point: p.point, market: p.market, odds: p.odds, book: p.book, p: p.p, value: true, suggested: advice(p).stake }) : ''}

      <details><summary>Cotes relevées (${(p.offers || []).length})</summary><table class="t">${(p.offers || []).map((o) => `<tr><td>${esc(o.title)}</td><td class="n">${num(o.price)}</td><td class="n muted">${ago(o.last)}</td></tr>`).join('')}</table></details>

      ${llm}
    </article>`;
  }
  // Consigne en clair : cote minimale à accepter et mise indicative (Kelly fractionné, plafonné).
  function advice(p) {
    const C = P.cfg();
    const minOdds = Math.ceil(((1 + C.minEV - (p.pPush || 0)) / Math.max(1e-6, p.p)) * 100) / 100;
    const k = Math.max(0, (p.p * p.odds + (p.pPush || 0) - 1) / (p.odds - 1));
    const frac = Math.min(C.maxStakePct, C.kellyFrac * k);
    const B = curBank();
    const stake = Math.round(B * frac * 100) / 100;
    return { minOdds, stake, frac, bank: B };
  }
  function adviceBox(p) {
    const a = advice(p);
    return `<div class="advice"><b>En clair :</b> sur ${esc(p.book)}, pariez « ${esc(p.label)} » pour ${esc(p.match)} seulement si la cote affichée est <b>au moins ${num(a.minOdds)}</b> (relevée : ${num(p.odds)}).
      Mise indicative : <b>${num(a.stake)} €</b> (${(a.frac * 100).toFixed(1)} % d’une bankroll de ${int(a.bank)} €, quart de Kelly plafonné). Si la cote a baissé ou si le match a commencé, ne pariez pas.</div>`;
  }
  const eur0 = (x) => x.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  function safeList(A) {
    const L = (A.safe || []).filter((s) => !A.daily || s.eventId !== A.daily.eventId);
    if (!L.length) return '';
    return `<section class="card"><h3>Autres paris sûrs du jour</h3><p class="muted">Très probables (≥ ${(P.cfg().safeMinP * 100).toFixed(0)} %) et cote Winamax pas en dessous de leur vraie valeur. Ne les combinez pas : jouez-les séparément, avec une petite mise chacun.</p>
      <div class="tw"><table class="t"><tbody>${L.map((s) => { const kind = s.tier === 1 ? 'sûr' : s.toVerify ? 'sûr-verif' : 'sûr-bas'; const st = safeStake(kind, s.p, s.odds, s.pPush);
        return `<tr><td><b>${esc(s.match)}</b><br><small class="muted">${dt(s.t)} · ${esc(s.comp)}</small></td><td>${esc(s.label)}</td><td class="n">${s.odds != null ? num(s.odds) : `≥ ${num(s.minOdds)}`}</td><td class="n">${pct(s.p, 0)}</td><td>${s.tier === 1 ? '<span class="tag t-ok">cote correcte</span>' : s.toVerify ? '<span class="tag t-warn">cote à vérifier sur Winamax</span>' : '<span class="tag t-warn">cote un peu basse</span>'}</td><td class="n">${num(st)} €</td><td>${betBtn({ source: 'safe', ...s, suggested: st })}</td></tr>`; }).join('')}</tbody></table></div></section>`;
  }
  function dailyCard(A) {

    if (!d) return `<section class="card nobet"><h3>Pas de pronostic à confiance forte aujourd’hui</h3><p>Aucun pari des prochaines 24 h ne réunit toutes les conditions : très probable, données solides, modèles d’accord avec le marché et aucun risque signalé. Mieux vaut ne pas parier, ou revenir plus tard avec « Actualiser et réanalyser ».</p>
      ${A.dailyAlt ? `<p class="muted">Meilleure alternative (confiance ${esc(A.dailyAlt.conf)}, à vos risques) : <b>${esc(A.dailyAlt.match)}</b> · ${esc(A.dailyAlt.label)} ${A.dailyAlt.odds != null ? '@ ' + num(A.dailyAlt.odds) : '(jouer si cote ≥ ' + num(A.dailyAlt.minOdds) + ')'} · ${pct(A.dailyAlt.p, 0)}</p>` : ''}</section>`;
    const C = P.cfg(), pk = d.pick;
    const minOdds = Math.ceil(((1 + C.minEV - (pk.pPush || 0)) / pk.p) * 100) / 100;
    const stake = safeStake(d.kind, pk.p, pk.odds, pk.pPush);
    const kindTag = { 'sûr-verif': '<span class="tag t-ok">PARI SÛR · cote à vérifier</span>', 'sûr': '<span class="tag t-ok">PARI SÛR · cote correcte</span>', 'sûr-bas': '<span class="tag t-warn">PARI SÛR · cote un peu basse</span>', value: '<span class="tag t-ok">VALUE</span>', probable: '<span class="tag t-na">probable, sans value</span>' }[d.kind] || '';
    const stakeNote = { 'sûr-verif': `${(C.safeStakePct * 100).toFixed(0)} % de la bankroll, si la cote Winamax est ≥ ${num(pk.minOdds)}`, 'sûr': `${(C.safeStakePct * 100).toFixed(0)} % de votre bankroll (${eur0(curBank())})`, 'sûr-bas': `${(C.safeStakePct * 50).toFixed(0)} % de la bankroll : cote un peu basse`, value: 'quart de Kelly plafonné', probable: '1 % de la bankroll : pas de value' }[d.kind];
    return `<section class="card pick big daily">
      <div class="eyebrow">PRONOSTIC DU JOUR${d.kind && d.kind.startsWith('sûr') ? ' · MODE PARIS SÛRS' : ''}</div>
      <header><div><span class="sport s-${d.sport}">${SPORT[d.sport]}</span> <span class="muted">${esc(d.comp)}</span></div><div class="when">${dt(d.t)}</div></header>
      <h3>${esc(d.match)}</h3>
      <div class="sel"><span class="mk">${MKT[pk.market] || ''}</span><b>${esc(pk.label)}</b> ${kindTag} <span class="tag t-${d.confidence === 'forte' ? 'ok' : d.confidence === 'moyenne' ? 'warn' : 'na'}">confiance ${esc(d.confidence)}</span></div>

      <h4>L’analyse</h4><ul>${d.why.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>

      ${betBtn({ source: 'daily', eventId: d.eventId, sport: d.sport, sportKey: d.sportKey, comp: d.comp, match: d.match, home: d.home, away: d.away, t: d.t, label: pk.label, type: pk.type, point: pk.point, market: pk.market, odds: pk.odds, book: pk.book, p: pk.p, value: pk.value, suggested: stake })}
      <p class="muted"><small>Vérifiez la cote sur Winamax avant de parier ; si le match a commencé ou si la cote a beaucoup baissé, abstenez-vous. ${esc(d.dataNote || '')}</small></p>
    </section>`;

  // bankroll actuelle = départ + dépôts/retraits + gains et pertes des paris réglés (mise à jour automatique)
  const curBank = () => { try { return SPMyBets.stats().bankroll; } catch { return P.cfg().bankroll; } };
  function safeStake(kind, p, odds, pPush) {
    const C = P.cfg(), B = curBank();
    if (kind === 'sûr' || kind === 'sûr-verif') return Math.round(B * C.safeStakePct * 100) / 100;
    if (kind === 'sûr-bas') return Math.round(B * C.safeStakePct * 0.5 * 100) / 100;
    if (kind === 'value') return Math.round(B * Math.min(C.maxStakePct, C.kellyFrac * Math.max(0, (p * odds + (pPush || 0) - 1) / (odds - 1))) * 100) / 100;
    return Math.round(B * 0.01 * 100) / 100;
  }
  const BETDRAFTS = new Map();
  function betBtn(d) {
    const id = 'd' + BETDRAFTS.size;
    BETDRAFTS.set(id, d);
    return `<button class="btn-sec betbtn" data-bet="${id}">J’ai parié</button>`;
  }
  function stakeFor(p, odds, pPush) {
    const C = P.cfg();
    const k = Math.max(0, (p * odds + (pPush || 0) - 1) / (odds - 1));
    return Math.round(C.bankroll * Math.min(C.maxStakePct, C.kellyFrac * k) * 100) / 100;
  }
  function formChips(fm) {
    if (!fm) return '<span class="muted">forme indisponible</span>';
    return `<span class="form" title="du plus ancien au plus récent (à droite)">${fm.seq.split('').map((r) => `<i class="r-${r}">${r}</i>`).join('')}</span> <small class="muted">${num(fm.gf, 1)} marqués / ${num(fm.ga, 1)} encaissés${fm.xgf != null ? ` · xG ${num(fm.xgf, 2)} / ${num(fm.xga, 2)}` : ''}</small>`;
  }
  function pronoCard(f) {
    const pr = f.probs || {};
    const bar = f.sport === 'football'
      ? `<div class="pbar3"><i style="width:${pr.home * 100}%" title="1"></i><i style="width:${pr.draw * 100}%" title="N"></i><i style="width:${pr.away * 100}%" title="2"></i></div><div class="pl3"><span>1 ${pct(pr.home, 0)}</span><span>N ${pct(pr.draw, 0)}</span><span>2 ${pct(pr.away, 0)}</span></div>`
      : `<div class="pbar3"><i style="width:${pr.home * 100}%"></i><i style="width:0"></i><i style="width:${pr.away * 100}%"></i></div><div class="pl3"><span>${pct(pr.home, 0)}</span><span></span><span>${pct(pr.away, 0)}</span></div>`;
    const [hn, an] = f.match.split(' – ');
    return `<article class="card prono">
      <header><div><span class="sport s-${f.sport}">${SPORT[f.sport]}</span> <span class="muted">${esc(f.comp)}</span></div><div class="when">${dt(f.t)}</div></header>
      <h3>${esc(f.match)}</h3>
      <p class="headline"><b>${esc(f.headline)}</b> <span class="tag t-${f.confidence === 'forte' ? 'ok' : f.confidence === 'moyenne' ? 'warn' : 'na'}">confiance ${esc(f.confidence)}</span></p>
      ${bar}
      ${f.sport === 'football' ? `<p class="muted">Score le plus probable <b>${f.score.h}-${f.score.a}</b> (${pct(f.score.p, 0)}) · buts attendus ${num(f.expected.home, 2)} – ${num(f.expected.away, 2)} · +2,5 buts ${pct(f.probs.over25, 0)} · les deux marquent ${pct(f.probs.btts, 0)}</p>` : ''}
      ${f.sport === 'nba' ? `<p class="muted">Score projeté <b>${Math.round(f.expected.home)}-${Math.round(f.expected.away)}</b> · total attendu ${num(f.expected.total, 1)} points</p>` : ''}
      ${f.form ? `<div class="formrow"><div><small>${esc(hn)}</small>${formChips(f.form.home)}</div><div><small>${esc(an)}</small>${formChips(f.form.away)}</div></div>` : ''}
      ${f.pick ? `<div class="advice"><b>Pari le plus probable :</b> ${esc(f.pick.label)} @ <b>${num(f.pick.odds)}</b> (${esc(f.pick.book)}) — probabilité ${pct(f.pick.p)}, EV ${sgn(f.pick.ev)} ${f.pick.value ? '<span class="tag t-ok">VALUE</span>' : '<span class="tag t-na">pas de value</span>'}</div>${betBtn({ source: 'prono', eventId: f.eventId, sport: f.sport, sportKey: f.sportKey, comp: f.comp, match: f.match, home: f.home, away: f.away, t: f.t, label: f.pick.label, type: f.pick.type, point: f.pick.point, market: f.pick.market, odds: f.pick.odds, book: f.pick.book, p: f.pick.p, value: f.pick.value, suggested: f.pick.value ? stakeFor(f.pick.p, f.pick.odds, f.pick.pPush) : null })}` : ''}
      ${f.facts?.length ? `<ul class="muted">${f.facts.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}
      ${f.markets ? `<details><summary>Tous les marchés (${f.markets.length})</summary><div class="tw"><table class="t"><thead><tr><th>Pari</th><th>Prob.</th><th>Cote juste</th><th>Jouer si ≥</th><th>Winamax</th></tr></thead><tbody>
        ${f.markets.map((m) => `<tr><td>${esc(m.label)}${m.risky ? ' <span class="tag t-warn">risqué</span>' : m.p >= P.cfg().safeMinP && m.minSafe >= P.cfg().minOdds ? ' <span class="tag t-ok">sûr</span>' : ''}</td><td class="n">${pct(m.p, 0)}${m.pPush ? ` <small class="muted">(remb. ${pct(m.pPush, 0)})</small>` : ''}</td><td class="n">${num(m.fair)}</td><td class="n">${num(m.p >= P.cfg().safeMinP && !m.risky ? m.minSafe : m.minValue)}</td><td class="n">${m.real ? `${num(m.real.odds)} <span class="${m.ev >= 0 ? 'pos' : 'neg'}">${sgn(m.ev)}</span>` : '<small class="muted">à vérifier</small>'}</td></tr>`).join('')}
        </tbody></table></div><p class="muted"><small>« Jouer si ≥ » : cote minimale à accepter sur Winamax (paris sûrs : jusqu’à ${Math.abs(P.cfg().safeTolEV * 100).toFixed(0)} % sous la cote juste ; autres : ${(P.cfg().minEV * 100).toFixed(0)} % au-dessus). Pour une cote précise, utilisez « Vérifier une cote ».</small></p></details>` : ''}
      ${f.scorers?.length ? `<details><summary>Buteurs (risqué)</summary><div class="tw"><table class="t"><thead><tr><th>Joueur</th><th>Buts saison</th><th>Prob. de marquer</th><th>Cote juste</th></tr></thead><tbody>${f.scorers.map((s) => `<tr><td>${esc(s.name)} <small class="muted">${esc(s.team)}</small></td><td class="n">${s.goals}</td><td class="n">${pct(s.p, 0)}</td><td class="n">${num(1 / s.p)}</td></tr>`).join('')}</tbody></table></div><p class="muted"><small>Estimation à partir des buts de la saison (ESPN) et des buts attendus du match, en supposant que le joueur est titulaire. Jamais proposé en pari sûr : un buteur reste très aléatoire.</small></p></details>` : ''}
      <p class="muted"><small>${esc(f.dataNote || '')}</small></p>
    </article>`;
  }
  function list(t, a) { return a?.length ? `<h5>${esc(t)}</h5><ul>${a.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : ''; }
  function whyText(p) {
    const bits = [];
    bits.push(`Le modèle estime ${pct(p.p)} contre ${pct(p.pImplied)} implicite à ${num(p.odds)} chez ${p.book}, soit une EV théorique de ${sgn(p.ev)}.`);
